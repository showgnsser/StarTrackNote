<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="370" viewBox="0 0 1200 370" role="img" aria-labelledby="title">
<title id="title">功率换档、PLL回退与失锁确认</title>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#263442"/></marker></defs>
<style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;font-size:22px;fill:#263442;text-anchor:middle} .small{font-size:18px}.box{fill:#fff;stroke:#263442;stroke-width:1.5}.flow{fill:none;stroke:#263442;stroke-width:1.5;marker-end:url(#arrow)}</style>
<rect width="1200" height="370" fill="#fff"/>
<rect x="35" y="20" width="310" height="80" rx="4" class="box"/>
<text x="190.0" y="68">调度NWPR</text>
<path d="M190 100V144" class="flow"/>
<rect x="35" y="145" width="310" height="80" rx="4" class="box"/>
<text x="190.0" y="193">载噪比累计确认</text>
<path d="M190 225V269" class="flow"/>
<rect x="35" y="270" width="310" height="80" rx="4" class="box"/>
<text x="190.0" y="318">选择跟踪状态</text>
<rect x="445" y="20" width="310" height="80" rx="4" class="box"/>
<text x="600.0" y="68">鉴相器输出</text>
<path d="M600 100V144" class="flow"/>
<rect x="445" y="145" width="310" height="80" rx="4" class="box"/>
<text x="600.0" y="193">200 ms相差RMS</text>
<path d="M600 225V269" class="flow"/>
<text x="662" y="253" class="small">＞45°</text>
<rect x="445" y="270" width="310" height="80" rx="4" class="box"/>
<text x="600.0" y="318">PLL回退纯FLL</text>
<rect x="855" y="20" width="310" height="80" rx="4" class="box"/>
<text x="1010.0" y="68">失锁NWPR</text>
<path d="M1010 100V144" class="flow"/>
<rect x="855" y="145" width="310" height="80" rx="4" class="box"/>
<text x="1010.0" y="193">R＜1，连续5份新报告</text>
<path d="M1010 225V269" class="flow"/>
<rect x="855" y="270" width="310" height="80" rx="4" class="box"/>
<text x="1010.0" y="318">退出并请求重捕</text>
</svg>
