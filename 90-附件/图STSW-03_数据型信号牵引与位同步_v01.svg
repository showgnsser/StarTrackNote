<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="900" viewBox="0 0 2200 900">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#222222"/>
    </marker>
    <style>
      .frame { fill:#ffffff; stroke:#222222; stroke-width:2; }
      .lane { fill:#fafafa; stroke:#8c8c8c; stroke-width:1.5; }
      .box { fill:#ffffff; stroke:#222222; stroke-width:2; }
      .line { fill:none; stroke:#222222; stroke-width:2; marker-end:url(#arrow); }
      .bus { fill:none; stroke:#222222; stroke-width:2; }
      .dot { fill:#222222; }
      .title { font:700 24px 'Noto Sans CJK SC','Microsoft YaHei',sans-serif; fill:#1f1f1f; }
      .text { font:21px 'Noto Sans CJK SC','Microsoft YaHei',sans-serif; fill:#1f1f1f; text-anchor:middle; }
      .small { font:17px 'Noto Sans CJK SC','Microsoft YaHei',sans-serif; fill:#333333; text-anchor:middle; }
      .label { font:18px 'Noto Sans CJK SC','Microsoft YaHei',sans-serif; fill:#333333; }
    </style>
  </defs>

  <rect x="10" y="10" width="2180" height="880" rx="8" class="frame"/>
  <rect x="35" y="386" width="185" height="88" class="box"/>
  <text x="128" y="421" class="text">连续1 ms</text>
  <text x="128" y="452" class="text">PDI相关结果</text>
  <path d="M220 430 H270" class="line"/>
  <path d="M270 138 V755" class="bus"/>
  <circle cx="270" cy="138" r="5" class="dot"/>
  <circle cx="270" cy="430" r="5" class="dot"/>
  <circle cx="270" cy="755" r="5" class="dot"/>

  <rect x="305" y="40" width="1850" height="275" rx="8" class="lane"/>
  <text x="335" y="78" class="title">载波牵引</text>
  <path d="M270 138 H350" class="line"/>
  <rect x="350" y="95" width="230" height="86" class="box"/>
  <text x="465" y="128" class="text">强入口</text>
  <text x="465" y="158" class="small">相邻1 ms鉴频</text>
  <rect x="645" y="95" width="300" height="86" class="box"/>
  <text x="795" y="126" class="text">20 ms平均</text>
  <text x="795" y="157" class="small">L1CA / B1I / G1</text>
  <path d="M580 138 H645" class="line"/>

  <path d="M270 245 H350" class="line"/>
  <rect x="350" y="202" width="230" height="86" class="box"/>
  <text x="465" y="235" class="text">中弱入口</text>
  <text x="465" y="265" class="small">160 ms非重叠观察</text>
  <rect x="645" y="202" width="450" height="86" class="box"/>
  <text x="870" y="232" class="text">L1CA：10 ms × 16　G1：5 ms × 32</text>
  <text x="870" y="264" class="small">11点功率DFT，覆盖−62.5～+62.5 Hz</text>
  <rect x="1150" y="202" width="350" height="86" class="box"/>
  <text x="1325" y="232" class="text">B1I：相邻1 ms鉴频</text>
  <text x="1325" y="264" class="small">159个结果平均，不枚举NH边界</text>
  <path d="M580 245 H645" class="line"/>
  <path d="M1095 245 H1150" class="line"/>

  <rect x="1570" y="119" width="230" height="96" class="box"/>
  <text x="1685" y="155" class="text">三阶FLL</text>
  <text x="1685" y="186" class="small">20 ms或160 ms更新</text>
  <path d="M945 138 H1515 V167 H1570" class="line"/>
  <path d="M1500 245 H1515 V167" class="bus"/>
  <rect x="1870" y="119" width="240" height="96" class="box"/>
  <text x="1990" y="155" class="text">载波NCO控制量</text>
  <text x="1990" y="186" class="small">频率与变化率连续</text>
  <path d="M1800 167 H1870" class="line"/>

  <rect x="305" y="335" width="1850" height="230" rx="8" class="lane"/>
  <text x="335" y="373" class="title">数据位同步</text>
  <path d="M270 430 H390" class="line"/>
  <rect x="390" y="398" width="330" height="88" class="box"/>
  <text x="555" y="431" class="text">11个频率 × 20种边界</text>
  <text x="555" y="462" class="small">B1I擦NH；G1擦meander</text>
  <rect x="800" y="398" width="260" height="88" class="box"/>
  <text x="930" y="431" class="text">1 s首次搜索</text>
  <text x="930" y="462" class="small">失败后扩展到2 s / 4 s</text>
  <rect x="1140" y="398" width="290" height="88" class="box"/>
  <text x="1285" y="431" class="text">独立数据确认</text>
  <text x="1285" y="462" class="small">不复用搜索窗口</text>
  <rect x="1510" y="398" width="260" height="88" class="box"/>
  <text x="1640" y="431" class="text">20 ms边界锁定</text>
  <text x="1640" y="462" class="small">恢复公开符号模板</text>
  <rect x="1850" y="398" width="260" height="88" class="box"/>
  <text x="1980" y="431" class="text">同步后相干积分</text>
  <text x="1980" y="462" class="small">导航bit正负仍未知</text>
  <path d="M720 442 H800" class="line"/>
  <path d="M1060 442 H1140" class="line"/>
  <path d="M1430 442 H1510" class="line"/>
  <path d="M1770 442 H1850" class="line"/>
  <text x="390" y="522" class="label">中弱入口立即并行积累；强入口在短周期FLL完成局部居中后开放。</text>

  <rect x="305" y="590" width="1850" height="260" rx="8" class="lane"/>
  <text x="335" y="628" class="title">码环牵引</text>
  <path d="M270 755 H365" class="line"/>
  <rect x="365" y="682" width="320" height="145" class="box"/>
  <text x="525" y="717" class="text">五抽头码观察</text>
  <text x="525" y="753" class="small">强：1 ms鉴别后20次平均</text>
  <text x="525" y="784" class="small">中弱：160 ms非相干积累</text>
  <rect x="770" y="708" width="250" height="94" class="box"/>
  <text x="895" y="743" class="text">Early–Late鉴别</text>
  <text x="895" y="775" class="small">输出码相位误差</text>
  <rect x="1105" y="708" width="250" height="94" class="box"/>
  <text x="1230" y="743" class="text">PI环路滤波器</text>
  <text x="1230" y="775" class="small">输出DLL残余码率</text>
  <rect x="1440" y="708" width="250" height="94" class="box"/>
  <text x="1565" y="743" class="text">Kca与码率合成</text>
  <text x="1565" y="775" class="small">标称码率 + 多普勒 + DLL</text>
  <rect x="1775" y="708" width="250" height="94" class="box"/>
  <text x="1900" y="743" class="text">码NCO控制量</text>
  <text x="1900" y="775" class="small">生成下一批Prompt相位</text>
  <path d="M685 755 H770" class="line"/>
  <path d="M1020 755 H1105" class="line"/>
  <path d="M1355 755 H1440" class="line"/>
  <path d="M1690 755 H1775" class="line"/>
</svg>
