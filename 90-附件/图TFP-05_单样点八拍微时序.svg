<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660">
  <defs><style>.t{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#eef4ff}.h{font-size:23px;font-weight:700}.m{font-size:15px}.s{font-size:12px;fill:#c3cee0}.head{fill:#274065;stroke:#77aefe}.c{fill:#17243a;stroke:#506889}.hot{fill:#1c3b31;stroke:#63cd98}.edge{fill:#3b272b;stroke:#ef7880}</style></defs>
  <rect width="1200" height="660" rx="22" fill="#0f1522"/><text x="600" y="37" text-anchor="middle" class="t h">30.72 Msps最坏输入：C0～C7是连续八个上升沿寄存动作</text>
  <g class="t m" text-anchor="middle"><rect x="205" y="58" width="113" height="42" class="head"/><text x="262" y="84">C0</text><rect x="318" y="58" width="113" height="42" class="head"/><text x="375" y="84">C1</text><rect x="431" y="58" width="113" height="42" class="head"/><text x="488" y="84">C2</text><rect x="544" y="58" width="113" height="42" class="head"/><text x="601" y="84">C3</text><rect x="657" y="58" width="113" height="42" class="head"/><text x="714" y="84">C4</text><rect x="770" y="58" width="113" height="42" class="head"/><text x="827" y="84">C5</text><rect x="883" y="58" width="113" height="42" class="head"/><text x="940" y="84">C6</text><rect x="996" y="58" width="113" height="42" class="head"/><text x="1053" y="84">C7</text></g>
  <g class="t s"><text x="28" y="135">样点/DDC</text><text x="28" y="202">NCO预计算</text><text x="28" y="269">码ROM</text><text x="28" y="336">码返回</text><text x="28" y="403">4-bank累加</text><text x="28" y="470">边界shadow</text><text x="28" y="537">NCO/PDI提交</text></g>
  <g class="t s" text-anchor="middle">
    <rect x="205" y="110" width="113" height="42" class="c"/><text x="262" y="136">锁存IQ/相位</text><rect x="318" y="110" width="113" height="42" class="c"/><text x="375" y="136">s8乘积</text><rect x="431" y="110" width="113" height="42" class="c"/><text x="488" y="136">s9/移位/s5</text><rect x="544" y="110" width="565" height="42" class="hot"/><text x="827" y="136">同一s5 DDC结果保持到C7</text>
    <rect x="318" y="177" width="113" height="42" class="c"/><text x="375" y="196">载波/码</text><text x="375" y="212">next</text><rect x="431" y="177" width="113" height="42" class="edge"/><text x="488" y="203">锁will_end</text>
    <rect x="318" y="244" width="113" height="42" class="c"/><text x="375" y="270">发VE</text><rect x="431" y="244" width="113" height="42" class="c"/><text x="488" y="270">发E</text><rect x="544" y="244" width="113" height="42" class="c"/><text x="601" y="270">发P</text><rect x="657" y="244" width="113" height="42" class="c"/><text x="714" y="270">发L</text><rect x="770" y="244" width="113" height="42" class="c"/><text x="827" y="270">发VL</text>
    <rect x="431" y="311" width="113" height="42" class="c"/><text x="488" y="337">VE返回</text><rect x="544" y="311" width="113" height="42" class="c"/><text x="601" y="337">E返回</text><rect x="657" y="311" width="113" height="42" class="c"/><text x="714" y="337">P返回</text><rect x="770" y="311" width="113" height="42" class="c"/><text x="827" y="337">L返回</text><rect x="883" y="311" width="113" height="42" class="c"/><text x="940" y="337">VL返回</text>
    <rect x="544" y="378" width="113" height="42" class="hot"/><text x="601" y="404">VE×4</text><rect x="657" y="378" width="113" height="42" class="hot"/><text x="714" y="404">E×4</text><rect x="770" y="378" width="113" height="42" class="hot"/><text x="827" y="404">P×4</text><rect x="883" y="378" width="113" height="42" class="hot"/><text x="940" y="404">L×4</text><rect x="996" y="378" width="113" height="42" class="hot"/><text x="1053" y="404">VL×4</text>
    <rect x="544" y="445" width="565" height="42" class="edge"/><text x="827" y="471">若will_end：每拍next_sum→对应shadow，state→0；否则next_sum→state</text>
    <rect x="996" y="512" width="113" height="50" class="edge"/><text x="1053" y="533">提交NCO</text><text x="1053" y="550">shadow_valid</text>
  </g>
  <rect x="85" y="591" width="1030" height="46" rx="10" fill="#202a39" stroke="#607086"/><text x="600" y="620" text-anchor="middle" class="t s">sample n在C0接收；C7完成VL与header，下一C0接收sample n+1。边界shadow包含本拍VL和sample_count+1。</text>
</svg>
