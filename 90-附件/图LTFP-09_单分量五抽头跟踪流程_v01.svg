<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="680" viewBox="0 0 1440 680">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#222222"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #222222; stroke-width: 1.6; }
      .region { fill: none; stroke: #666666; stroke-width: 1.3; stroke-dasharray: 7 6; }
      .line { fill: none; stroke: #222222; stroke-width: 1.7; marker-end: url(#arrow); }
      .feedback { fill: none; stroke: #555555; stroke-width: 1.6;
                  stroke-dasharray: 7 5; marker-end: url(#arrow); }
      .title { font-size: 20px; fill: #111111; text-anchor: middle; }
      .text { font-size: 16px; fill: #222222; text-anchor: middle; }
      .label { font-size: 16px; fill: #222222; }
      .small { font-size: 15px; fill: #333333; text-anchor: middle; }
    </style>
  </defs>
  <rect x="0" y="0" width="1440" height="680" fill="#ffffff"/>

  <rect class="region" x="18" y="25" width="1082" height="535"/>
  <text class="label" x="35" y="55" font-family="SimSun, Songti SC, serif">硬件相关通道</text>

  <rect class="box" x="42" y="132" width="138" height="78"/>
  <text class="title" x="111" y="164" font-family="SimSun, Songti SC, serif">ADC输入</text>
  <text class="text" x="111" y="193" font-family="'Times New Roman', serif">s4 I / Q</text>

  <path class="line" d="M180,171 H230"/>
  <rect class="box" x="232" y="116" width="172" height="110"/>
  <text class="title" x="318" y="154" font-family="SimSun, Songti SC, serif">载波DDC</text>
  <text class="text" x="318" y="183" font-family="SimSun, Songti SC, serif">复数共轭混频</text>
  <text class="text" x="318" y="211" font-family="'Times New Roman', serif">s4 → s5 I / Q</text>

  <path class="line" d="M404,171 H666"/>
  <text class="small" x="535" y="158" font-family="'Times New Roman', serif">s5 I / Q shared bus</text>

  <rect class="box" x="668" y="92" width="190" height="158"/>
  <text class="title" x="763" y="127" font-family="SimSun, Songti SC, serif">五路复相关</text>
  <text class="text" x="763" y="160" font-family="'Times New Roman', serif">VE / E / P / L / VL</text>
  <text class="text" x="763" y="193" font-family="SimSun, Songti SC, serif">I/Q保持或取反</text>
  <text class="text" x="763" y="224" font-family="'Times New Roman', serif">5 × s5 I / Q</text>

  <path class="line" d="M858,171 H900"/>
  <rect class="box" x="902" y="92" width="178" height="158"/>
  <text class="title" x="991" y="127" font-family="SimSun, Songti SC, serif">1 ms复数积分</text>
  <text class="text" x="991" y="160" font-family="SimSun, Songti SC, serif">五组独立累加器</text>
  <text class="text" x="991" y="193" font-family="'Times New Roman', serif">5 × s18 I / Q</text>
  <text class="text" x="991" y="224" font-family="SimSun, Songti SC, serif">PDI输出</text>

  <rect class="box" x="232" y="410" width="172" height="86"/>
  <text class="title" x="318" y="445" font-family="SimSun, Songti SC, serif">载波NCO</text>
  <text class="text" x="318" y="476" font-family="'Times New Roman', serif">u32 phase / step</text>
  <path class="line" d="M318,410 V226"/>

  <rect class="box" x="438" y="410" width="160" height="86"/>
  <text class="title" x="518" y="445" font-family="SimSun, Songti SC, serif">码NCO</text>
  <text class="text" x="518" y="476" font-family="'Times New Roman', serif">uQ14.36 phase</text>

  <path class="line" d="M598,453 H630"/>
  <rect class="box" x="632" y="398" width="170" height="110"/>
  <text class="title" x="717" y="435" font-family="SimSun, Songti SC, serif">五抽头生成</text>
  <text class="text" x="717" y="467" font-family="'Times New Roman', serif">VE / E / P / L / VL</text>
  <text class="text" x="717" y="494" font-family="'Times New Roman', serif">uQ14.36</text>

  <path class="line" d="M802,453 H832"/>
  <rect class="box" x="834" y="398" width="196" height="110"/>
  <text class="title" x="932" y="435" font-family="SimSun, Songti SC, serif">单分量PRN RAM</text>
  <text class="text" x="932" y="467" font-family="SimSun, Songti SC, serif">五个本地码符号</text>
  <text class="text" x="932" y="494" font-family="'Times New Roman', serif">5 × (+1 / -1)</text>
  <path class="line" d="M932,398 V304 H763 V250"/>

  <path class="line" d="M1080,171 H1168"/>
  <text class="small" x="1124" y="158" font-family="SimSun, Songti SC, serif">5组PDI</text>
  <rect class="box" x="1170" y="100" width="238" height="148"/>
  <text class="title" x="1289" y="137" font-family="SimSun, Songti SC, serif">后级跟踪控制</text>
  <text class="text" x="1289" y="174" font-family="SimSun, Songti SC, serif">读取PDI结果</text>
  <text class="text" x="1289" y="207" font-family="SimSun, Songti SC, serif">更新NCO与抽头参数</text>

  <path class="feedback" d="M1238,248 V590 H318 V496"/>
  <text class="label" x="713" y="579" font-family="'Times New Roman', serif">carrier_step</text>
  <path class="feedback" d="M1340,248 V625 H518 V496"/>
  <text class="label" x="760" y="615" font-family="'Times New Roman', serif">code_step / tap spacing</text>
</svg>
