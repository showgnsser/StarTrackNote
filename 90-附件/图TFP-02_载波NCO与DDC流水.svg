<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560">
  <defs><style>.t{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#edf4ff}.h{font-size:24px;font-weight:700}.m{font-size:17px}.s{font-size:14px;fill:#bbc8db}.b{fill:#17233a;stroke:#6fa8ff;stroke-width:2}.q{fill:#2b213a;stroke:#b892ff;stroke-width:2}.a{stroke:#dae6f6;stroke-width:2;fill:none;marker-end:url(#x)}</style><marker id="x" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#dae6f6"/></marker></defs>
  <rect width="1200" height="560" rx="22" fill="#0f1522"/><text x="600" y="42" text-anchor="middle" class="t h">载波NCO只产生本地载波；输入IQ与LUT系数在复乘器汇合</text>
  <rect x="45" y="85" width="165" height="82" rx="12" class="b"/><text x="128" y="116" text-anchor="middle" class="t m">s4输入I/Q</text><text x="128" y="144" text-anchor="middle" class="t s">合法奇数±1/3/5/7</text>
  <rect x="45" y="218" width="165" height="82" rx="12" class="b"/><text x="128" y="249" text-anchor="middle" class="t m">u32相位累加器</text><text x="128" y="277" text-anchor="middle" class="t s">本样点相位先保持</text>
  <rect x="265" y="218" width="165" height="82" rx="12" class="b"/><text x="348" y="249" text-anchor="middle" class="t m">高4 bit索引</text><text x="348" y="277" text-anchor="middle" class="t s">16个相位区间</text>
  <rect x="485" y="218" width="195" height="82" rx="12" class="q"/><text x="583" y="249" text-anchor="middle" class="t m">bin中心s5 C/S LUT</text><text x="583" y="277" text-anchor="middle" class="t s">θ=(i+1/2)·2π/16</text>
  <rect x="745" y="120" width="190" height="116" rx="12" class="b"/><text x="840" y="153" text-anchor="middle" class="t m">4乘2加复数共轭</text><text x="840" y="182" text-anchor="middle" class="t s">s8乘积，s9加减</text><text x="840" y="210" text-anchor="middle" class="t s">IQ与C/S两路共同输入</text>
  <rect x="990" y="120" width="170" height="116" rx="12" class="b"/><text x="1075" y="153" text-anchor="middle" class="t m">算术右移4</text><text x="1075" y="182" text-anchor="middle" class="t s">向负无穷取整</text><text x="1075" y="210" text-anchor="middle" class="t s">饱和成s5 I/Q</text>
  <path d="M210 126H690C715 126 720 158 745 158" class="a"/><path d="M210 259H265M430 259H485M680 259C720 259 715 207 745 207" class="a"/><path d="M935 178H990" class="a"/>
  <rect x="90" y="365" width="1020" height="132" rx="14" fill="#152031" stroke="#4e607a"/><text x="600" y="397" text-anchor="middle" class="t m">固定相位约定与更新顺序</text><text x="125" y="431" class="t s">• NCO原始phase=0仍选择11.25°附近的bin中心；PDI记录原始phase，不自动加1/32周。</text><text x="125" y="461" class="t s">• 当前样点先用当前phase完成复乘和全部tap相关；C7才提交phase_next=(phase+step) mod 2³²。</text><text x="125" y="491" class="t s">• 普通换字只改变step，绝不重装载phase；固定半bin偏置影响绝对相位约定，但不改变频率差分。</text>
  <text x="600" y="535" text-anchor="middle" class="t s">图中两条输入支路是并行关系：IQ绝不“流经”载波相位累加器。</text>
</svg>
