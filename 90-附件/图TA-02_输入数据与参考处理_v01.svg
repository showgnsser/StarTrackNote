<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="690" viewBox="0 0 1100 690" role="img" aria-labelledby="title desc">
<title id="title">PDI解码、参考换算与相关支路组织</title>
<desc id="desc">输入通过完整性和时间检查后进行浮点解码与本地参考换算。默认闭环分量统一固定相位，其他有效分量和副本独立保留。异常记录不进入正常积分。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#263442"/></marker></defs>
<style>text{font-family:"Noto Sans CJK SC",sans-serif;font-size:23px;fill:#263442;text-anchor:middle}.small{font-size:18px}.box{fill:#fff;stroke:#263442;stroke-width:1.6}.shade{fill:#eef3f6;stroke:#263442;stroke-width:1.6}.flow{fill:none;stroke:#263442;stroke-width:1.7;marker-end:url(#arrow)}</style>
<rect width="1100" height="690" fill="#fff"/>
<rect x="300" y="25" width="500" height="64" rx="5" class="shade"/><text x="550" y="64">硬件PDI与通道配置</text>
<path d="M550 89V137" class="flow"/>
<rect x="350" y="140" width="400" height="64" rx="5" class="box"/><text x="550" y="179">完整性与时间连续性检查</text>
<path d="M750 172H842" class="flow"/><text x="795" y="155" class="small">异常</text>
<rect x="845" y="134" width="225" height="78" rx="5" class="box"/><text x="957" y="166">隔离异常记录</text><text x="957" y="195" class="small">失效统计重新收数</text>
<path d="M550 204V262" class="flow"/><text x="588" y="239" class="small">有效</text>
<rect x="350" y="265" width="400" height="80" rx="5" class="box"/><text x="550" y="298">浮点解码与NCO参考换算</text><text x="550" y="326" class="small">保留相关尺度及实际时间标识</text>
<path d="M550 345V385H295V427" class="flow"/><path d="M550 385H830V427" class="flow"/>
<rect x="60" y="430" width="470" height="80" rx="5" class="box"/><text x="295" y="463">闭环分量选择与固定相位统一</text><text x="295" y="491" class="small">同一分量五抽头采用相同旋转</text>
<rect x="620" y="430" width="420" height="80" rx="5" class="box"/><text x="830" y="463">保留原始分量与副本</text><text x="830" y="491" class="small">维持独立支路及对应关系</text>
<path d="M295 510V557" class="flow"/><path d="M830 510V557" class="flow"/>
<rect x="60" y="560" width="470" height="64" rx="5" class="shade"/><text x="295" y="599">积分、鉴别与同步</text>
<rect x="620" y="560" width="420" height="64" rx="5" class="shade"/><text x="830" y="599">双副本码鉴别／数据处理</text>
<text x="550" y="666" class="small">各支路保留相同的时间标识与实际NCO参考</text>
</svg>
