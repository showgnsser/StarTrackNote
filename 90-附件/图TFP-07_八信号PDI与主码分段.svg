<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640">
  <defs><style>.t{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#eef4ff}.h{font-size:24px;font-weight:700}.m{font-size:16px}.s{font-size:13px;fill:#becadd}.seg{fill:#1b3150;stroke:#6da7ff;stroke-width:1.5}.alt{fill:#1d3a31;stroke:#5fcb94;stroke-width:1.5}.line{stroke:#60728d;stroke-width:1}</style></defs>
  <rect width="1200" height="640" rx="22" fill="#0f1522"/><text x="600" y="42" text-anchor="middle" class="t h">每条PDI约1 ms，但完整主码可跨1、4或10条PDI</text>
  <text x="45" y="95" class="t m">L1CA / B1I / G1</text><rect x="255" y="69" width="865" height="48" rx="8" class="seg"/><text x="687" y="99" text-anchor="middle" class="t m">segment 0；一条PDI即完整主码</text>
  <text x="45" y="175" class="t m">L5 / B2A / E5A</text><rect x="255" y="149" width="865" height="48" rx="8" class="alt"/><text x="687" y="179" text-anchor="middle" class="t m">segment 0；10230 chip主码在1 ms内完成</text>
  <text x="45" y="273" class="t m">Galileo E1</text>
  <g class="t s" text-anchor="middle"><rect x="255" y="231" width="216" height="58" class="seg"/><text x="363" y="265">seg 0</text><rect x="471" y="231" width="216" height="58" class="alt"/><text x="579" y="265">seg 1</text><rect x="687" y="231" width="216" height="58" class="seg"/><text x="795" y="265">seg 2</text><rect x="903" y="231" width="217" height="58" class="alt"/><text x="1011" y="265">seg 3</text></g>
  <text x="255" y="315" class="t s">4条连续PDI后code_period加1；片段边界不把PRN地址清零</text>
  <text x="45" y="405" class="t m">BDS B1C</text>
  <g class="t s" text-anchor="middle"><rect x="255" y="355" width="86" height="58" class="seg"/><text x="298" y="389">0</text><rect x="341" y="355" width="86" height="58" class="alt"/><text x="384" y="389">1</text><rect x="427" y="355" width="86" height="58" class="seg"/><text x="470" y="389">2</text><rect x="513" y="355" width="86" height="58" class="alt"/><text x="556" y="389">3</text><rect x="599" y="355" width="86" height="58" class="seg"/><text x="642" y="389">4</text><rect x="685" y="355" width="86" height="58" class="alt"/><text x="728" y="389">5</text><rect x="771" y="355" width="86" height="58" class="seg"/><text x="814" y="389">6</text><rect x="857" y="355" width="86" height="58" class="alt"/><text x="900" y="389">7</text><rect x="943" y="355" width="86" height="58" class="seg"/><text x="986" y="389">8</text><rect x="1029" y="355" width="91" height="58" class="alt"/><text x="1074" y="389">9</text></g>
  <text x="255" y="441" class="t s">10条连续PDI后code_period加1；软件再组合完整10 ms主码</text>
  <rect x="120" y="498" width="960" height="92" rx="12" fill="#202a3a" stroke="#5d708b"/><text x="600" y="530" text-anchor="middle" class="t m">硬件PDI边界由码NCO越过下一片段码相位决定</text><text x="600" y="558" text-anchor="middle" class="t s">当前样点先进入相关器，再推进码NCO并判断边界；量化余数必须带入下一片段。</text><text x="600" y="581" text-anchor="middle" class="t s">二次码和导航bit不在硬件边界剥离，由软件根据segment/code_period同步后统一处理。</text>
</svg>
