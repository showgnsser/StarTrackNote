<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="650" viewBox="0 0 1080 650">
<title>观察、控制与稳定性监测</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#263442"/></marker></defs>
<style>text{font-family:"Noto Sans CJK SC",sans-serif;font-size:23px;fill:#263442;text-anchor:middle}.small{font-size:18px}.box{fill:white;stroke:#263442;stroke-width:1.6}.shade{fill:#eef3f6;stroke:#263442;stroke-width:1.6}.arrow{fill:none;stroke:#263442;stroke-width:1.7;marker-end:url(#a)}</style><rect width="1080" height="650" fill="white"/>
<rect x="300" y="25" width="480" height="65" rx="5" class="shade"/><text x="540" y="65">本次观察＋时标＋有效性</text>
<path d="M540 90V125H260V172" class="arrow"/><path d="M540 125H815V172" class="arrow"/>
<rect x="50" y="175" width="420" height="75" rx="5" class="box"/><text x="260" y="207">当前控制</text><text x="260" y="237" class="small">检查本次观察是否允许入环</text>
<rect x="610" y="175" width="410" height="75" rx="5" class="box"/><text x="815" y="207">历史监测</text><text x="815" y="237" class="small">有效率、偏差、抖动和变化率</text>
<path d="M260 250V317" class="arrow"/><path d="M815 250V317" class="arrow"/>
<rect x="50" y="320" width="420" height="75" rx="5" class="box"/><text x="260" y="353">FLL／PLL／DLL校正</text><text x="260" y="382" class="small">不以监测均值代替本次误差</text>
<rect x="610" y="320" width="410" height="75" rx="5" class="box"/><text x="815" y="353">形成稳定性与动态证据</text><text x="815" y="382" class="small">不同RMS和平均绝对误差分开</text>
<path d="M260 395V462" class="arrow"/><path d="M815 395V462" class="arrow"/>
<rect x="50" y="465" width="420" height="75" rx="5" class="shade"/><text x="260" y="510">连续NCO控制</text>
<rect x="610" y="465" width="410" height="75" rx="5" class="shade"/><text x="815" y="510">预测许可与状态选择</text>
<text x="540" y="608" class="small">监测未成熟不停止有效环路更新；一次控制成功不代表历史已稳定</text>
</svg>
