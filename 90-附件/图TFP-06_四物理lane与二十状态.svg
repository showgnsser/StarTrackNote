<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="600" viewBox="0 0 1180 600">
  <defs><style>.t{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#eef4ff}.h{font-size:24px;font-weight:700}.m{font-size:16px}.s{font-size:13px;fill:#c0cce0}.b{fill:#18263e;stroke:#6da7ff;stroke-width:2}.g{fill:#19372f;stroke:#61ca94;stroke-width:2}.p{fill:#33263d;stroke:#bd8bea;stroke-width:2}.a{fill:none;stroke:#dce7f5;stroke-width:2;marker-end:url(#x)}</style><marker id="x" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#dce7f5"/></marker></defs>
  <rect width="1180" height="600" rx="22" fill="#0f1522"/><text x="590" y="40" text-anchor="middle" class="t h">4条复lane对应4个独立bank；每个bank保存5个tap历史</text>
  <rect x="35" y="100" width="190" height="92" rx="12" class="b"/><text x="130" y="132" text-anchor="middle" class="t m">固定s5 DDC样点</text><text x="130" y="160" text-anchor="middle" class="t s">五个批次共用I/Q</text>
  <rect x="35" y="250" width="190" height="126" rx="12" class="b"/><text x="130" y="282" text-anchor="middle" class="t m">本批四个码符号</text><text x="130" y="312" text-anchor="middle" class="t s">data/full，data/prn</text><text x="130" y="339" text-anchor="middle" class="t s">pilot/full，pilot/prn</text>
  <rect x="290" y="76" width="260" height="326" rx="14" class="g"/><text x="420" y="110" text-anchor="middle" class="t m">4条复数lane</text><text x="420" y="138" text-anchor="middle" class="t s">每lane：I/Q两条s25检测加法</text>
  <g class="t m"><text x="330" y="195">lane 0</text><text x="330" y="243">lane 1</text><text x="330" y="291">lane 2</text><text x="330" y="339">lane 3</text></g><g class="t s"><text x="430" y="195">data / full</text><text x="430" y="243">data / prn</text><text x="430" y="291">pilot / full</text><text x="430" y="339">pilot / prn</text></g>
  <path d="M225 146H290M225 313H290" class="a"/>
  <g class="t s" text-anchor="middle">
    <rect x="625" y="70" width="500" height="82" rx="12" class="b"/><text x="875" y="98" class="m">lane bank 0：5 × s24复状态</text><text x="875" y="127">P[0] E[1] L[2] VE[3] VL[4]，组合读/同步写</text>
    <rect x="625" y="164" width="500" height="82" rx="12" class="b"/><text x="875" y="192" class="m">lane bank 1：5 × s24复状态</text><text x="875" y="221">P[0] E[1] L[2] VE[3] VL[4]，组合读/同步写</text>
    <rect x="625" y="258" width="500" height="82" rx="12" class="b"/><text x="875" y="286" class="m">lane bank 2：5 × s24复状态</text><text x="875" y="315">P[0] E[1] L[2] VE[3] VL[4]，组合读/同步写</text>
    <rect x="625" y="352" width="500" height="82" rx="12" class="b"/><text x="875" y="380" class="m">lane bank 3：5 × s24复状态</text><text x="875" y="409">P[0] E[1] L[2] VE[3] VL[4]，组合读/同步写</text>
  </g>
  <path d="M550 195H580V111H625M550 243H590V205H625M550 291H590V299H625M550 339H580V393H625" class="a"/>
  <rect x="385" y="492" width="610" height="72" rx="12" class="p"/><text x="690" y="520" text-anchor="middle" class="t m">PDI边界：本tap next_sum写shadow，同时该bank地址写0</text><text x="690" y="547" text-anchor="middle" class="t s">五拍后shadow有20槽，四个bank的20地址也全部清零；下一样点无需清零气泡。</text>
  <path d="M875 434V492" class="a"/>
