<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="310" viewBox="0 0 1040 310">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#222222"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #222222; stroke-width: 1.5; }
      .line { fill: none; stroke: #222222; stroke-width: 1.8; marker-end: url(#arrow); }
      .plain { fill: none; stroke: #222222; stroke-width: 1.5; }
      .title { font-size: 24px; fill: #111111; text-anchor: middle; }
      .fmt { font-size: 19px; fill: #333333; text-anchor: middle; }
      .note { font-size: 18px; fill: #333333; text-anchor: middle; }
    </style>
  </defs>
  <rect x="0" y="0" width="1040" height="310" fill="#ffffff"/>

  <rect class="box" x="40" y="105" width="250" height="100"/>
  <text class="title" x="165" y="146" font-family="SimSun, Songti SC, serif">ADC量化输出</text>
  <text class="fmt" x="165" y="179" font-family="'Times New Roman', serif">s4 I/Q</text>

  <path class="plain" d="M290,155 H460"/>
  <circle cx="460" cy="155" r="5" fill="#222222"/>
  <path class="line" d="M460,155 V83 H610"/>
  <path class="line" d="M460,155 V227 H610"/>

  <rect class="box" x="612" y="33" width="330" height="100"/>
  <text class="title" x="777" y="74" font-family="SimSun, Songti SC, serif">跟踪通道0输入</text>
  <text class="fmt" x="777" y="107" font-family="'Times New Roman', serif">s4 I/Q</text>

  <rect class="box" x="612" y="177" width="330" height="100"/>
  <text class="title" x="777" y="218" font-family="SimSun, Songti SC, serif">跟踪通道N-1输入</text>
  <text class="fmt" x="777" y="251" font-family="'Times New Roman', serif">s4 I/Q</text>

  <text class="note" x="460" y="295" font-family="SimSun, Songti SC, serif">全部启用通道接收同一时刻、同一数值的复数采样序列</text>
</svg>
