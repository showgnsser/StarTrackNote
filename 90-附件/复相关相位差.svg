<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560">
  <rect width="900" height="560" rx="20" fill="#f8fbff"/>
  <text x="450" y="42" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#1f2937">相邻复相关的相位差对应残余频率</text>
  <line x1="90" y1="430" x2="810" y2="430" stroke="#9ca3af" stroke-width="2"/>
  <line x1="450" y1="80" x2="450" y2="500" stroke="#9ca3af" stroke-width="2"/>
  <circle cx="450" cy="430" r="250" fill="none" stroke="#d1d5db" stroke-width="2" stroke-dasharray="8 8"/>
  <defs>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2f80ed"/></marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#eb5757"/></marker>
  </defs>
  <line x1="450" y1="430" x2="670" y2="310" stroke="#2f80ed" stroke-width="6" marker-end="url(#arrowBlue)"/>
  <line x1="450" y1="430" x2="560" y2="208" stroke="#eb5757" stroke-width="6" marker-end="url(#arrowRed)"/>
  <path d="M560 370 A125 125 0 0 0 540 320" fill="none" stroke="#27ae60" stroke-width="4"/>
  <text x="675" y="300" font-family="sans-serif" font-size="20" fill="#2f80ed">Z(k-1)</text>
  <text x="565" y="195" font-family="sans-serif" font-size="20" fill="#c0392b">Z(k)</text>
  <text x="580" y="350" font-family="sans-serif" font-size="20" fill="#20884a">相位差 Δφ</text>
  <text x="450" y="530" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#4b5563">Δf = Δφ / (2πT)；实现用 conj(Z(k-1)) · Z(k) 直接得到差角</text>
</svg>
