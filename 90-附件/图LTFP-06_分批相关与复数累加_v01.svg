<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="430" viewBox="0 0 1240 430">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#222222"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #222222; stroke-width: 1.5; }
      .line { fill: none; stroke: #222222; stroke-width: 1.7;
              marker-end: url(#arrow); }
      .title { font-size: 21px; fill: #111111; text-anchor: middle; }
      .text { font-size: 17px; fill: #222222; text-anchor: middle; }
      .caption { font-size: 18px; fill: #222222; }
    </style>
  </defs>
  <rect x="0" y="0" width="1240" height="430" fill="#ffffff"/>
  <text x="22" y="30" class="caption"
        font-family="SimSun, Songti SC, serif">相关支路与1 ms相干积分</text>

  <rect class="box" x="25" y="75" width="190" height="85"/>
  <text class="title" x="120" y="109"
        font-family="SimSun, Songti SC, serif">DDC输出</text>
  <text class="text" x="120" y="139"
        font-family="'Times New Roman', serif">s5 I / Q</text>

  <rect class="box" x="25" y="265" width="190" height="95"/>
  <text class="title" x="120" y="301"
        font-family="SimSun, Songti SC, serif">资源池有效支路</text>
  <text class="text" x="120" y="332"
        font-family="'Times New Roman', serif">5 / 6 / 5 / 11 results</text>

  <path class="line" d="M215,117 H300"/>
  <path class="line" d="M215,312 H260 V195 H300"/>
  <rect class="box" x="302" y="100" width="210" height="115"/>
  <text class="title" x="407" y="138"
        font-family="SimSun, Songti SC, serif">符号选择</text>
  <text class="text" x="407" y="169"
        font-family="SimSun, Songti SC, serif">I/Q保持或取反</text>
  <text class="text" x="407" y="197"
        font-family="'Times New Roman', serif">s5 → s5</text>

  <rect class="box" x="302" y="275" width="210" height="90"/>
  <text class="title" x="407" y="310"
        font-family="SimSun, Songti SC, serif">池内支路调度</text>
  <text class="text" x="407" y="341"
        font-family="SimSun, Songti SC, serif">数据P / 导频码抽头</text>

  <path class="line" d="M512,157 H595"/>
  <path class="line" d="M512,320 H555 V235 H595"/>
  <rect class="box" x="597" y="80" width="270" height="190"/>
  <text class="title" x="732" y="116"
        font-family="SimSun, Songti SC, serif">最多3条复数相关lane</text>
  <text class="text" x="732" y="148"
        font-family="SimSun, Songti SC, serif">资源池0：1条</text>
  <text class="text" x="732" y="178"
        font-family="SimSun, Songti SC, serif">资源池1：最多2条</text>
  <text class="text" x="732" y="208"
        font-family="SimSun, Songti SC, serif">资源池2：1条</text>
  <text class="text" x="732" y="238"
        font-family="SimSun, Songti SC, serif">资源池3：最多3条</text>

  <path class="line" d="M867,175 H935"/>
  <rect class="box" x="937" y="90" width="275" height="170"/>
  <text class="title" x="1074" y="128"
        font-family="SimSun, Songti SC, serif">四类相干积分RAM</text>
  <text class="text" x="1074" y="162"
        font-family="'Times New Roman', serif">pool 0 / 2 / 3: s18 I / Q</text>
  <text class="text" x="1074" y="194"
        font-family="'Times New Roman', serif">pool 1: s20 I / Q</text>
  <text class="text" x="1074" y="226"
        font-family="SimSun, Songti SC, serif">PDI保持池内s18 / s20位宽</text>

  <text x="595" y="330" class="caption"
        font-family="SimSun, Songti SC, serif">不同采样率分别确定积分位宽，只保存实际使用的相关支路</text>
</svg>
