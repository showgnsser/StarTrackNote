<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="470" viewBox="0 0 1120 470">
  <defs><style>.t{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#eef4ff}.h{font-size:24px;font-weight:700}.m{font-size:17px}.s{font-size:14px;fill:#c1cde0}.p{fill:#3b272b;stroke:#ef7780;stroke-width:2}.f{fill:#1b3a31;stroke:#61cc96;stroke-width:2}.line{stroke:#dbe6f4;stroke-width:3;marker-end:url(#x)}</style><marker id="x" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#dbe6f4"/></marker></defs>
  <rect width="1120" height="470" rx="22" fill="#0f1522"/><text x="560" y="42" text-anchor="middle" class="t h">捕获移交点不在1 ms码边界时，首条PDI必须标记partial</text>
  <line x1="85" y1="238" x2="1030" y2="238" class="line"/>
  <line x1="180" y1="185" x2="180" y2="291" stroke="#6da7ff" stroke-width="3"/><line x1="470" y1="185" x2="470" y2="291" stroke="#6da7ff" stroke-width="3"/><line x1="800" y1="185" x2="800" y2="291" stroke="#6da7ff" stroke-width="3"/>
  <circle cx="300" cy="238" r="10" fill="#f2c463"/><text x="300" y="160" text-anchor="middle" class="t m">start_sample / 移交码相位</text>
  <rect x="300" y="205" width="170" height="66" rx="8" class="p"/><text x="385" y="235" text-anchor="middle" class="t m">首条partial PDI</text><text x="385" y="258" text-anchor="middle" class="t s">只覆盖剩余码区间</text>
  <rect x="470" y="205" width="330" height="66" rx="8" class="f"/><text x="635" y="235" text-anchor="middle" class="t m">下一条完整PDI</text><text x="635" y="258" text-anchor="middle" class="t s">从合法片段边界开始</text>
  <text x="180" y="330" text-anchor="middle" class="t s">上一边界</text><text x="470" y="330" text-anchor="middle" class="t s">下一边界</text><text x="800" y="330" text-anchor="middle" class="t s">再下一边界</text>
  <rect x="115" y="370" width="890" height="62" rx="10" fill="#202a39" stroke="#62718a"/><text x="560" y="398" text-anchor="middle" class="t m">partial不是错误，但禁止进入要求完整1 ms的长相干、同步和鉴别器窗口</text><text x="560" y="421" text-anchor="middle" class="t s">两个NCO仍从start_sample连续推进；不能为了凑满1 ms而回放已经被捕获消费的样点。</text>
</svg>
