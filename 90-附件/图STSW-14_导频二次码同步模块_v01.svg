<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="815" viewBox="0 0 1000 815">
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#263442"/></marker></defs>
<style>text{font-family:"Noto Sans CJK SC",sans-serif;fill:#263442;text-anchor:middle;font-size:24px}.small{font-size:18px}.head{font-size:21px;font-weight:600}.node{fill:white;stroke:#263442;stroke-width:1.7}.end{fill:#eef3f6;stroke:#263442;stroke-width:1.7}.arrow{fill:none;stroke:#263442;stroke-width:1.8;marker-end:url(#a)}.wire{fill:none;stroke:#263442;stroke-width:1.8}.dash{fill:none;stroke:#263442;stroke-width:1.8;stroke-dasharray:6 5;marker-end:url(#a)}</style>
<rect width="1000" height="815" fill="white"/>
<rect x="70" y="20" width="360" height="65" rx="7" class="end"/>
<text x="250" y="52" class="">原始导频Prompt</text>
<text x="250" y="75" class="small">保持移交频率；无频率候选</text>
<path d="M250 85V125" class="arrow"/>
<rect x="70" y="125" width="360" height="75" rx="4" class="node"/>
<text x="250" y="157" class="">枚举二次码相位并擦码</text>
<text x="250" y="190" class="small">L5：20相位；B2a / E5a：100相位</text>
<path d="M250 200V240" class="arrow"/>
<rect x="70" y="240" width="360" height="65" rx="4" class="node"/>
<text x="250" y="272" class="">段内相干</text>
<text x="250" y="295" class="small">20 ms</text>
<path d="M250 305V345" class="arrow"/>
<rect x="70" y="345" width="360" height="65" rx="4" class="node"/>
<text x="250" y="377" class="">段间功率累加</text>
<text x="250" y="400" class="small">50块 → 1 s评分</text>
<path d="M250 410V450" class="arrow"/>
<rect x="70" y="450" width="360" height="75" rx="4" class="node"/>
<text x="250" y="482" class="">最佳 / 次佳相位比较</text>
<text x="250" y="515" class="small">峰值比 ≥1.18</text>
<path d="M430 487H507V53H590" class="arrow"/>
<text x="469" y="475" class="small">通过</text>
<rect x="590" y="20" width="340" height="65" rx="4" class="node"/>
<text x="760" y="60.5" class="">保存候选，清空历史</text>
<path d="M760 85V145" class="arrow"/>
<rect x="590" y="145" width="340" height="75" rx="4" class="node"/>
<text x="760" y="177" class="">独立1 s新数据</text>
<text x="760" y="210" class="small">重算全部相位；同一1.18门限</text>
<path d="M760 220V280" class="arrow"/>
<rect x="590" y="280" width="340" height="75" rx="4" class="node"/>
<text x="760" y="325.5" class="">质量有效且相位一致</text>
<path d="M760 355V415" class="arrow"/>
<rect x="590" y="415" width="340" height="65" rx="7" class="end"/>
<text x="760" y="455.5" class="">锁定二次码相位</text>
<path d="M760 480V540" class="arrow"/>
<rect x="590" y="540" width="340" height="65" rx="4" class="node"/>
<text x="760" y="580.5" class="">五抽头统一擦码</text>
<path d="M760 605V665" class="arrow"/>
<rect x="590" y="665" width="340" height="65" rx="7" class="end"/>
<text x="760" y="705.5" class="">接入相干跟踪</text>
<text x="250" y="640" class="small">搜索无效：保留980 ms</text>
<text x="250" y="672" class="small">新增20 ms后重算</text>
<text x="500" y="778" class="small">确认使用全新数据；未锁定前不向闭环输出候选擦码结果</text>
</svg>
