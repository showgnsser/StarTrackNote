<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="820" viewBox="0 0 1800 820">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#222222"/>
    </marker>
    <style>
      .frame { fill:#ffffff; stroke:#222222; stroke-width:2; }
      .panel { fill:#fafafa; stroke:#8f8f8f; stroke-width:1.5; }
      .box { fill:#ffffff; stroke:#222222; stroke-width:2; }
      .line { fill:none; stroke:#222222; stroke-width:2; marker-end:url(#arrow); }
      .plain { fill:none; stroke:#222222; stroke-width:2; }
      .guide { fill:none; stroke:#9a9a9a; stroke-width:1.5; stroke-dasharray:7 6; }
      .curve { fill:none; stroke:#2b6cb0; stroke-width:4; }
      .point { fill:#2b6cb0; }
      .title { font:700 25px 'Noto Sans CJK SC','Microsoft YaHei',sans-serif; fill:#1f1f1f; }
      .text { font:21px 'Noto Sans CJK SC','Microsoft YaHei',sans-serif; fill:#1f1f1f; text-anchor:middle; }
      .small { font:18px 'Noto Sans CJK SC','Microsoft YaHei',sans-serif; fill:#333333; text-anchor:middle; }
      .left { font:19px 'Noto Sans CJK SC','Microsoft YaHei',sans-serif; fill:#252525; }
      .math { font:20px 'Noto Serif','Times New Roman',serif; fill:#1f1f1f; }
      .tap { font:700 19px 'Noto Sans CJK SC','Microsoft YaHei',sans-serif; fill:#1f1f1f; text-anchor:middle; }
    </style>
  </defs>

  <rect x="10" y="10" width="1780" height="800" rx="8" class="frame"/>

  <rect x="35" y="35" width="800" height="355" rx="8" class="panel"/>
  <text x="65" y="75" class="title">五抽头如何判断码相位方向</text>
  <path d="M105 320 H765" class="plain"/>
  <path d="M105 315 C185 300,245 260,315 205 C365 166,402 118,438 102 C476 119,510 157,565 205 C632 264,700 300,765 315" class="curve"/>

  <path d="M145 118 V320" class="guide"/>
  <path d="M285 118 V320" class="guide"/>
  <path d="M425 92 V320" class="guide"/>
  <path d="M565 118 V320" class="guide"/>
  <path d="M705 118 V320" class="guide"/>

  <circle cx="285" cy="229" r="6" class="point"/>
  <circle cx="425" cy="106" r="6" class="point"/>
  <circle cx="565" cy="205" r="6" class="point"/>
  <path d="M285 229 V320" class="plain"/>
  <path d="M565 205 V320" class="plain"/>

  <text x="145" y="349" class="tap">VE</text>
  <text x="285" y="349" class="tap">E</text>
  <text x="425" y="349" class="tap">P</text>
  <text x="565" y="349" class="tap">L</text>
  <text x="705" y="349" class="tap">VL</text>
  <text x="260" y="217" class="tap">A<tspan baseline-shift="sub" font-size="14">E</tspan></text>
  <text x="590" y="193" class="tap">A<tspan baseline-shift="sub" font-size="14">L</tspan></text>
  <text x="355" y="376" class="small">d</text>
  <text x="495" y="376" class="small">d</text>
  <path d="M410 369 H300" class="line"/>
  <path d="M440 369 H550" class="line"/>

  <rect x="865" y="35" width="900" height="355" rx="8" class="panel"/>
  <text x="895" y="75" class="title">Early–Late码鉴相</text>
  <text x="905" y="120" class="math">Prompt固定：</text>
  <text x="1085" y="120" class="math">e_code = (1-d)(A_L-A_E)/(A_E+A_L)</text>
  <text x="905" y="172" class="math">宽峰牵引：</text>
  <text x="1085" y="172" class="math">e_code = (p-2)d + (1-d)(A_(p+1)-A_(p-1))/(A_(p-1)+A_(p+1))</text>

  <rect x="915" y="218" width="245" height="105" class="box"/>
  <text x="1038" y="250" class="text">A<tspan baseline-shift="sub" font-size="15">E</tspan> = A<tspan baseline-shift="sub" font-size="15">L</tspan></text>
  <text x="1038" y="285" class="small">e<tspan baseline-shift="sub" font-size="13">code</tspan> = 0</text>
  <text x="1038" y="311" class="small">Prompt已经居中</text>

  <rect x="1190" y="218" width="245" height="105" class="box"/>
  <text x="1313" y="250" class="text">A<tspan baseline-shift="sub" font-size="15">L</tspan> &gt; A<tspan baseline-shift="sub" font-size="15">E</tspan></text>
  <text x="1313" y="285" class="small">e<tspan baseline-shift="sub" font-size="13">code</tspan> &gt; 0</text>
  <text x="1313" y="311" class="small">提高本地码率</text>

  <rect x="1465" y="218" width="245" height="105" class="box"/>
  <text x="1588" y="250" class="text">A<tspan baseline-shift="sub" font-size="15">E</tspan> &gt; A<tspan baseline-shift="sub" font-size="15">L</tspan></text>
  <text x="1588" y="285" class="small">e<tspan baseline-shift="sub" font-size="13">code</tspan> &lt; 0</text>
  <text x="1588" y="311" class="small">降低本地码率</text>

  <text x="35" y="440" class="title">载波辅助二阶DLL闭环</text>

  <rect x="40" y="485" width="225" height="84" class="box"/>
  <text x="153" y="518" class="text">五抽头观测量</text>
  <text x="153" y="550" class="small">A<tspan baseline-shift="sub" font-size="13">VE</tspan> / A<tspan baseline-shift="sub" font-size="13">E</tspan> / A<tspan baseline-shift="sub" font-size="13">P</tspan> / A<tspan baseline-shift="sub" font-size="13">L</tspan> / A<tspan baseline-shift="sub" font-size="13">VL</tspan></text>

  <rect x="315" y="485" width="210" height="84" class="box"/>
  <text x="420" y="518" class="text">峰值选择</text>
  <text x="420" y="550" class="small">确定局部中心p</text>

  <rect x="575" y="485" width="230" height="84" class="box"/>
  <text x="690" y="518" class="text">Early–Late鉴别</text>
  <text x="690" y="550" class="small">输出e<tspan baseline-shift="sub" font-size="13">code</tspan>，单位chip</text>

  <rect x="855" y="485" width="225" height="84" class="box"/>
  <text x="968" y="518" class="text">PI环路滤波器</text>
  <text x="968" y="550" class="small">K<tspan baseline-shift="sub" font-size="13">P</tspan>e + ∑K<tspan baseline-shift="sub" font-size="13">I</tspan>e</text>

  <rect x="1260" y="477" width="170" height="100" class="box"/>
  <text x="1345" y="519" class="text">码率求和</text>
  <text x="1345" y="550" class="small">标称 + 辅助 + DLL</text>

  <rect x="1475" y="485" width="250" height="84" class="box"/>
  <text x="1600" y="518" class="text">码NCO</text>
  <text x="1600" y="550" class="small">码率积分为Prompt相位</text>

  <path d="M265 527 H315" class="line"/>
  <path d="M525 527 H575" class="line"/>
  <path d="M805 527 H855" class="line"/>
  <path d="M1080 527 H1260" class="line"/>
  <text x="1170" y="510" class="small">Δf<tspan baseline-shift="sub" font-size="13">DLL</tspan></text>
  <path d="M1430 527 H1475" class="line"/>

  <rect x="745" y="650" width="225" height="72" class="box"/>
  <text x="858" y="681" class="text">载波多普勒估计</text>
  <text x="858" y="708" class="small">f̂<tspan baseline-shift="sub" font-size="13">D</tspan></text>
  <polygon points="1035,650 1175,686 1035,722" class="box"/>
  <text x="1083" y="682" class="text">K<tspan baseline-shift="sub" font-size="14">ca</tspan></text>
  <text x="1092" y="708" class="small">载波辅助</text>
  <rect x="1280" y="650" width="205" height="72" class="box"/>
  <text x="1383" y="681" class="text">标称码率</text>
  <text x="1383" y="708" class="small">f<tspan baseline-shift="sub" font-size="13">code,0</tspan></text>

  <path d="M970 686 H1035" class="line"/>
  <path d="M1175 686 H1215 V558 H1260" class="line"/>
  <path d="M1383 650 V577" class="line"/>

  <path d="M1600 569 V765 H153 V569" class="line"/>
  <text x="875" y="788" class="small">码NCO输出新的Prompt相位，下一批五抽头再次测量剩余码误差</text>
</svg>
