<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="820" viewBox="0 0 1800 820">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#222222"/>
    </marker>
    <style>
      .frame { fill:#ffffff; stroke:#222222; stroke-width:2; }
      .panel { fill:#fafafa; stroke:#8f8f8f; stroke-width:1.5; }
      .box { fill:#ffffff; stroke:#222222; stroke-width:2; }
      .line { fill:none; stroke:#222222; stroke-width:2; marker-end:url(#arrow); }
      .plain { fill:none; stroke:#222222; stroke-width:2; }
      .guide { fill:none; stroke:#9a9a9a; stroke-width:1.4; stroke-dasharray:7 6; }
      .curve { fill:none; stroke:#2b6cb0; stroke-width:4; }
      .point { fill:#2b6cb0; }
      .title { font:700 24px 'Noto Sans CJK SC','Microsoft YaHei',sans-serif; fill:#1f1f1f; }
      .text { font:20px 'Noto Sans CJK SC','Microsoft YaHei',sans-serif; fill:#1f1f1f; text-anchor:middle; }
      .small { font:17px 'Noto Sans CJK SC','Microsoft YaHei',sans-serif; fill:#333333; text-anchor:middle; }
      .math { font:21px 'Noto Serif','Times New Roman',serif; fill:#1f1f1f; text-anchor:middle; }
      .tap { font:700 18px 'Noto Sans CJK SC','Microsoft YaHei',sans-serif; fill:#1f1f1f; text-anchor:middle; }
    </style>
  </defs>

  <rect x="10" y="10" width="1780" height="800" rx="8" class="frame"/>
  <rect x="35" y="35" width="790" height="350" rx="8" class="panel"/>
  <text x="65" y="74" class="title">相关峰与五个码抽头</text>
  <path d="M105 315 H755" class="plain"/>
  <path d="M105 310 C180 296,240 260,305 210 C360 168,395 118,430 102 C468 119,510 162,560 207 C625 264,692 299,755 310" class="curve"/>
  <path d="M145 125 V315" class="guide"/>
  <path d="M285 125 V315" class="guide"/>
  <path d="M425 92 V315" class="guide"/>
  <path d="M565 125 V315" class="guide"/>
  <path d="M705 125 V315" class="guide"/>
  <circle cx="285" cy="226" r="6" class="point"/>
  <circle cx="425" cy="105" r="6" class="point"/>
  <circle cx="565" cy="211" r="6" class="point"/>
  <text x="145" y="346" class="tap">VE</text>
  <text x="285" y="346" class="tap">E</text>
  <text x="425" y="346" class="tap">P</text>
  <text x="565" y="346" class="tap">L</text>
  <text x="705" y="346" class="tap">VL</text>
  <text x="255" y="216" class="tap">A<tspan baseline-shift="sub" font-size="13">E</tspan></text>
  <text x="595" y="201" class="tap">A<tspan baseline-shift="sub" font-size="13">L</tspan></text>

  <rect x="855" y="35" width="910" height="350" rx="8" class="panel"/>
  <text x="885" y="74" class="title">Early–Late鉴别只比较相关峰左右两侧</text>
  <rect x="900" y="100" width="370" height="220" class="box"/>
  <text x="1085" y="136" class="text">归一化码误差</text>
  <text x="955" y="205" class="math">e<tspan baseline-shift="sub" font-size="14">code</tspan> = (1-d) ×</text>
  <text x="1162" y="180" class="math">A<tspan baseline-shift="sub" font-size="14">L</tspan> − A<tspan baseline-shift="sub" font-size="14">E</tspan></text>
  <path d="M1080 195 H1240" class="plain"/>
  <text x="1162" y="225" class="math">A<tspan baseline-shift="sub" font-size="14">E</tspan> + A<tspan baseline-shift="sub" font-size="14">L</tspan></text>
  <text x="1085" y="275" class="small">差值给方向，和值消除幅度变化</text>
  <rect x="1305" y="100" width="410" height="62" class="box"/>
  <text x="1510" y="139" class="text">A<tspan baseline-shift="sub" font-size="14">E</tspan> = A<tspan baseline-shift="sub" font-size="14">L</tspan>：Prompt居中</text>
  <rect x="1305" y="179" width="410" height="62" class="box"/>
  <text x="1510" y="218" class="text">A<tspan baseline-shift="sub" font-size="14">L</tspan> &gt; A<tspan baseline-shift="sub" font-size="14">E</tspan>：提高本地码率</text>
  <rect x="1305" y="258" width="410" height="62" class="box"/>
  <text x="1510" y="297" class="text">A<tspan baseline-shift="sub" font-size="14">E</tspan> &gt; A<tspan baseline-shift="sub" font-size="14">L</tspan>：降低本地码率</text>

  <text x="35" y="438" class="title">二阶DLL闭环</text>
  <rect x="40" y="485" width="210" height="82" class="box"/>
  <text x="145" y="517" class="text">五抽头观测量</text>
  <text x="145" y="548" class="small">VE / E / P / L / VL</text>
  <rect x="300" y="485" width="190" height="82" class="box"/>
  <text x="395" y="517" class="text">峰值选择</text>
  <text x="395" y="548" class="small">确定局部中心</text>
  <rect x="540" y="485" width="220" height="82" class="box"/>
  <text x="650" y="517" class="text">Early–Late鉴别</text>
  <text x="650" y="548" class="small">码误差，单位chip</text>
  <rect x="810" y="485" width="210" height="82" class="box"/>
  <text x="915" y="517" class="text">PI环路滤波器</text>
  <text x="915" y="548" class="small">DLL残余码率</text>
  <circle cx="1250" cy="526" r="27" class="box"/>
  <text x="1250" y="534" class="text">+</text>
  <rect x="1360" y="485" width="190" height="82" class="box"/>
  <text x="1455" y="517" class="text">码NCO</text>
  <text x="1455" y="548" class="small">积分为Prompt相位</text>
  <path d="M250 526 H300" class="line"/>
  <path d="M490 526 H540" class="line"/>
  <path d="M760 526 H810" class="line"/>
  <path d="M1020 526 H1223" class="line"/>
  <path d="M1277 526 H1360" class="line"/>

  <rect x="730" y="625" width="220" height="70" class="box"/>
  <text x="840" y="655" class="text">载波多普勒</text>
  <text x="840" y="683" class="small">来自载波环</text>
  <polygon points="1000,625 1120,660 1000,695" class="box"/>
  <text x="1045" y="668" class="text">K<tspan baseline-shift="sub" font-size="14">ca</tspan></text>
  <path d="M950 660 H1000" class="line"/>

  <rect x="1170" y="620" width="260" height="80" class="box"/>
  <text x="1300" y="653" class="text">基础码率</text>
  <text x="1300" y="682" class="small">标称码率 + K<tspan baseline-shift="sub" font-size="13">ca</tspan> × 多普勒</text>
  <path d="M1120 660 H1170" class="line"/>
  <rect x="1170" y="735" width="260" height="58" class="box"/>
  <text x="1300" y="771" class="text">标称码率</text>
  <path d="M1300 735 V700" class="line"/>
  <path d="M1300 620 V590 H1250 V553" class="line"/>

  <rect x="1585" y="485" width="170" height="82" class="box"/>
  <text x="1670" y="517" class="text">五抽头本地码</text>
  <text x="1670" y="548" class="small">下一批相关</text>
  <path d="M1550 526 H1585" class="line"/>
  <path d="M1670 567 V720 H145 V567" class="line"/>
</svg>
