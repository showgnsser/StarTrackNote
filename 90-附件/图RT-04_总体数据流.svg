<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#334155"/></marker>
    <style>
      .title{font-family:'Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:25px;font-weight:700;fill:#0f172a}
      .h{font-family:'Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:17px;font-weight:700;fill:#0f172a}
      .t{font-family:'Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:14px;fill:#334155}
      .box{stroke:#334155;stroke-width:2;rx:12;ry:12}
      .arrow{stroke:#334155;stroke-width:2;fill:none;marker-end:url(#a)}
      .feedback{stroke:#dc2626;stroke-width:3;fill:none;marker-end:url(#a)}
    </style>
  </defs>
  <rect width="1400" height="650" fill="#fff"/>
  <text x="700" y="38" text-anchor="middle" class="title">StarTrack闭环总数据流：测量、控制、策略和测试判分严格分层</text>
  <rect x="45" y="95" width="160" height="90" class="box" fill="#e0f2fe"/>
  <text x="125" y="130" text-anchor="middle" class="h">I/Q输入</text>
  <text x="125" y="157" text-anchor="middle" class="t">StarGen或前端</text>
  <rect x="245" y="95" width="190" height="90" class="box" fill="#e0f2fe"/>
  <text x="340" y="125" text-anchor="middle" class="h">HardwareChannel</text>
  <text x="340" y="150" text-anchor="middle" class="t">混频、本地码、五抽头</text>
  <text x="340" y="172" text-anchor="middle" class="t">每1 ms相关</text>
  <rect x="475" y="95" width="170" height="90" class="box" fill="#dcfce7"/>
  <text x="560" y="125" text-anchor="middle" class="h">PDI解码/选分量</text>
  <text x="560" y="151" text-anchor="middle" class="t">校验epoch、cmd_id</text>
  <text x="560" y="173" text-anchor="middle" class="t">必要时擦二次码</text>
  <path d="M205 140 H245" class="arrow"/><path d="M435 140 H475" class="arrow"/>
  <rect x="705" y="70" width="190" height="90" class="box" fill="#fef3c7"/>
  <text x="800" y="102" text-anchor="middle" class="h">载波观察器</text>
  <text x="800" y="128" text-anchor="middle" class="t">FreqObs / PhaseObs</text>
  <text x="800" y="150" text-anchor="middle" class="t">只估误差</text>
  <rect x="705" y="190" width="190" height="90" class="box" fill="#fef3c7"/>
  <text x="800" y="222" text-anchor="middle" class="h">码观察器</text>
  <text x="800" y="248" text-anchor="middle" class="t">E-L或ASPeCT</text>
  <text x="800" y="270" text-anchor="middle" class="t">粗/细语义分离</text>
  <path d="M645 130 L705 115" class="arrow"/><path d="M645 150 L705 235" class="arrow"/>
  <rect x="955" y="70" width="170" height="90" class="box" fill="#fee2e2"/>
  <text x="1040" y="102" text-anchor="middle" class="h">CarrierLoop</text>
  <text x="1040" y="128" text-anchor="middle" class="t">FLL / PLL / 预测</text>
  <text x="1040" y="150" text-anchor="middle" class="t">输出载波控制</text>
  <rect x="955" y="190" width="170" height="90" class="box" fill="#fee2e2"/>
  <text x="1040" y="222" text-anchor="middle" class="h">CodeLoop</text>
  <text x="1040" y="248" text-anchor="middle" class="t">载波辅助 + DLL</text>
  <text x="1040" y="270" text-anchor="middle" class="t">只消费fine观察</text>
  <path d="M895 115 H955" class="arrow"/><path d="M895 235 H955" class="arrow"/>
  <rect x="1190" y="120" width="170" height="110" class="box" fill="#f8fafc"/>
  <text x="1275" y="152" text-anchor="middle" class="h">HwCmd</text>
  <text x="1275" y="178" text-anchor="middle" class="t">载波step、码step</text>
  <text x="1275" y="202" text-anchor="middle" class="t">下一1 ms边界生效</text>
  <path d="M1125 115 L1190 155" class="arrow"/><path d="M1125 235 L1190 200" class="arrow"/>
  <path d="M1275 230 V340 H340 V185" class="feedback"/>
  <text x="790" y="330" text-anchor="middle" class="t" fill="#dc2626">反馈：下一条命令由后续PDI中的cmd_id确认</text>
  <rect x="705" y="400" width="190" height="95" class="box" fill="#ede9fe"/>
  <text x="800" y="432" text-anchor="middle" class="h">监测器</text>
  <text x="800" y="458" text-anchor="middle" class="t">RMS、变化率、DLL稳定</text>
  <text x="800" y="480" text-anchor="middle" class="t">C/N0、同步健康</text>
  <rect x="955" y="400" width="170" height="95" class="box" fill="#ede9fe"/>
  <text x="1040" y="432" text-anchor="middle" class="h">11状态FSM</text>
  <text x="1040" y="458" text-anchor="middle" class="t">只选择策略</text>
  <text x="1040" y="480" text-anchor="middle" class="t">不重算鉴别公式</text>
  <path d="M800 280 V400" class="arrow"/><path d="M1040 280 V400" class="arrow"/><path d="M895 447 H955" class="arrow"/>
  <rect x="440" y="540" width="520" height="75" class="box" fill="#f1f5f9"/>
  <text x="700" y="570" text-anchor="middle" class="h">Logger + Analyzer（闭环之外）</text>
  <text x="700" y="596" text-anchor="middle" class="t">保存track/pdi/events与SHA；对同窗真值判稳定、精度和状态职责</text>
  <path d="M800 495 L760 540" class="arrow"/><path d="M1040 495 L905 540" class="arrow"/>
</svg>
