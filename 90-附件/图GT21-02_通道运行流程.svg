<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="380" viewBox="0 0 1320 380" role="img" aria-labelledby="title desc">
  <title id="title">捕获入口与常规跟踪阶段</title>
  <desc id="desc">捕获强档与中弱档分别选择20毫秒和160毫秒入口，随后均进行载码牵引与同步。同步确认后进入收敛，完成收敛后持续跟踪。此图只表示常规阶段递进，重试、退出和动态提前接管由正文说明。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#263442"/></marker>
  </defs>
  <style>
    text { font-family: "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #263442; text-anchor: middle; }
    .label { font-size: 22px; }
    .small { font-size: 18px; }
    .box { fill: #FFFFFF; stroke: #263442; stroke-width: 1.5; }
    .shade { fill: #EEF3F6; stroke: #263442; stroke-width: 1.5; }
    .line { fill: none; stroke: #263442; stroke-width: 1.5; }
    .flow { fill: none; stroke: #263442; stroke-width: 1.5; marker-end: url(#arrow); }
  </style>
  <rect width="1320" height="380" fill="#FFFFFF"/>
  <rect x="30" y="163" width="140" height="74" rx="4" class="shade"/>
  <text x="100" y="207" class="label">捕获移交</text>

  <path d="M170 200H194V105H219" class="flow"/>
  <path d="M194 200V280H219" class="flow"/>
  <rect x="220" y="70" width="190" height="70" rx="4" class="box"/>
  <text x="315" y="100" class="label">强档入口</text>
  <text x="315" y="126" class="small">20 ms更新</text>
  <rect x="220" y="245" width="190" height="70" rx="4" class="box"/>
  <text x="315" y="275" class="label">中弱档入口</text>
  <text x="315" y="301" class="small">160 ms更新</text>

  <path d="M410 105H450V280H410" class="line"/>
  <path d="M450 200H499" class="flow"/>
  <rect x="500" y="150" width="230" height="100" rx="4" class="box"/>
  <text x="615" y="190" class="label">牵引与同步</text>
  <text x="615" y="222" class="small">载码环与同步并行</text>

  <path d="M730 200H854" class="flow"/>
  <text x="792" y="184" class="small">同步确认</text>
  <rect x="855" y="150" width="170" height="100" rx="4" class="box"/>
  <text x="940" y="207" class="label">同步后收敛</text>

  <path d="M1025 200H1119" class="flow"/>
  <text x="1072" y="184" class="small">完成收敛</text>
  <rect x="1120" y="150" width="170" height="100" rx="4" class="shade"/>
  <text x="1205" y="207" class="label">持续跟踪</text>
</svg>
