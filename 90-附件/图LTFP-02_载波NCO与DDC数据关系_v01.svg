<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="310" viewBox="0 0 1420 310">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#222222"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #222222; stroke-width: 1.5; }
      .line { fill: none; stroke: #222222; stroke-width: 1.8; marker-end: url(#arrow); }
      .title { font-size: 23px; fill: #111111; text-anchor: middle; }
      .fmt { font-size: 18px; fill: #333333; text-anchor: middle; }
      .caption { font-size: 18px; fill: #222222; }
    </style>
  </defs>
  <rect x="0" y="0" width="1420" height="310" fill="#ffffff"/>
  <text x="22" y="32" class="caption" font-family="SimSun, Songti SC, serif">载波NCO与DDC数据关系</text>

  <rect class="box" x="25" y="70" width="170" height="90"/>
  <text class="title" x="110" y="106" font-family="SimSun, Songti SC, serif">ADC输入</text>
  <text class="fmt" x="110" y="139" font-family="'Times New Roman', serif">s4 I/Q</text>

  <path class="line" d="M195,115 H348"/>
  <rect class="box" x="350" y="70" width="210" height="90"/>
  <text class="title" x="455" y="106" font-family="SimSun, Songti SC, serif">复数乘加</text>
  <text class="fmt" x="455" y="139" font-family="SimSun, Songti SC, serif">4个s8乘积 → 2个s9结果</text>

  <path class="line" d="M560,115 H638"/>
  <rect class="box" x="640" y="70" width="210" height="90"/>
  <text class="title" x="745" y="106" font-family="SimSun, Songti SC, serif">算术右移4 bit</text>
  <text class="fmt" x="745" y="139" font-family="'Times New Roman', serif">s9</text>

  <path class="line" d="M850,115 H928"/>
  <rect class="box" x="930" y="70" width="190" height="90"/>
  <text class="title" x="1025" y="106" font-family="SimSun, Songti SC, serif">s5输出</text>
  <text class="fmt" x="1025" y="139" font-family="'Times New Roman', serif">-10 ~ +10</text>

  <path class="line" d="M1120,115 H1198"/>
  <rect class="box" x="1200" y="70" width="190" height="90"/>
  <text class="title" x="1295" y="106" font-family="SimSun, Songti SC, serif">DDC输出</text>
  <text class="fmt" x="1295" y="139" font-family="'Times New Roman', serif">s5 I/Q</text>

  <rect class="box" x="220" y="210" width="210" height="78"/>
  <text class="title" x="325" y="242" font-family="SimSun, Songti SC, serif">载波NCO</text>
  <text class="fmt" x="325" y="271" font-family="'Times New Roman', serif">u32 phase / step</text>

  <path class="line" d="M430,249 H508"/>
  <rect class="box" x="510" y="210" width="230" height="78"/>
  <text class="title" x="625" y="242" font-family="SimSun, Songti SC, serif">16相位系数表</text>
  <text class="fmt" x="625" y="271" font-family="'Times New Roman', serif">sQ1.4 C / S</text>

  <path class="line" d="M625,210 V181 H455 V162"/>
</svg>
