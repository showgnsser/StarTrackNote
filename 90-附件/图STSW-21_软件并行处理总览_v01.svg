<style>text{font-family:"Noto Sans CJK SC",sans-serif;font-size:23px;fill:#263442;text-anchor:middle}.small{font-size:18px}.box{fill:#fff;stroke:#263442;stroke-width:1.6}.shade{fill:#eef3f6;stroke:#263442;stroke-width:1.6}.line,.gate{fill:none;stroke:#263442;stroke-width:1.7;marker-end:url(#a)}.gate{stroke-dasharray:6 5}</style>
<rect width="1080" height="720" fill="white"/>
