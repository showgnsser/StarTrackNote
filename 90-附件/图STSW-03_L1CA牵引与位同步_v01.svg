<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="820" viewBox="0 0 2200 820">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#222222"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #222222; stroke-width: 2; }
      .group { fill: #fafafa; stroke: #9a9a9a; stroke-width: 1.5; }
      .line { fill: none; stroke: #222222; stroke-width: 2; marker-end: url(#arrow); }
      .bus { fill: none; stroke: #222222; stroke-width: 2; }
      .title { font: 700 25px 'Noto Sans CJK SC','Microsoft YaHei',sans-serif; fill: #1f1f1f; }
      .text { font: 22px 'Noto Sans CJK SC','Microsoft YaHei',sans-serif; fill: #1f1f1f; text-anchor: middle; }
      .small { font: 18px 'Noto Sans CJK SC','Microsoft YaHei',sans-serif; fill: #3a3a3a; text-anchor: middle; }
      .label { font: 700 20px 'Noto Sans CJK SC','Microsoft YaHei',sans-serif; fill: #1f1f1f; }
      .note { font: 18px 'Noto Sans CJK SC','Microsoft YaHei',sans-serif; fill: #555555; }
    </style>
  </defs>

  <rect x="20" y="20" width="2160" height="780" rx="8" class="box"/>

  <text x="500" y="62" class="title">载波牵引</text>
  <rect x="40" y="82" width="1470" height="405" rx="8" class="group"/>

  <rect x="70" y="230" width="180" height="76" class="box"/>
  <text x="160" y="260" class="text">连续1 ms</text>
  <text x="160" y="289" class="text">五抽头PDI</text>

  <rect x="310" y="205" width="190" height="126" class="box"/>
  <text x="405" y="246" class="text">捕获等级</text>
  <text x="405" y="279" class="small">强入口</text>
  <text x="405" y="307" class="small">普通入口</text>
  <path d="M250 268 H310" class="line"/>

  <text x="535" y="124" class="label">强入口</text>
  <rect x="530" y="138" width="235" height="78" class="box"/>
  <text x="648" y="169" class="text">相邻1 ms Prompt</text>
  <text x="648" y="198" class="text">叉点积鉴频</text>
  <rect x="805" y="138" width="235" height="78" class="box"/>
  <text x="923" y="169" class="text">20对结果平均</text>
  <text x="923" y="198" class="small">每20 ms发布</text>
  <rect x="1080" y="138" width="150" height="78" class="box"/>
  <text x="1155" y="186" class="text">FLL</text>

  <text x="535" y="326" class="label">普通入口</text>
  <rect x="530" y="340" width="235" height="78" class="box"/>
  <text x="648" y="371" class="text">10 ms短相干</text>
  <text x="648" y="400" class="small">块间累加功率</text>
  <rect x="805" y="340" width="235" height="78" class="box"/>
  <text x="923" y="369" class="text">1280 ms频率窗</text>
  <text x="923" y="398" class="small">11点DFT，每160 ms发布</text>
  <rect x="1080" y="340" width="150" height="78" class="box"/>
  <text x="1155" y="388" class="text">FLL</text>

  <path d="M500 246 H515 V177 H530" class="line"/>
  <path d="M500 290 H515 V379 H530" class="line"/>
  <path d="M765 177 H805" class="line"/>
  <path d="M1040 177 H1080" class="line"/>
  <path d="M765 379 H805" class="line"/>
  <path d="M1040 379 H1080" class="line"/>

  <rect x="1270" y="175" width="215" height="206" class="box"/>
  <text x="1378" y="213" class="text">位同步开放资格</text>
  <text x="1378" y="254" class="small">最近3次绝对频率一致</text>
  <text x="1378" y="286" class="small">当前残差 ≤ 15.625 Hz</text>
  <text x="1378" y="318" class="small">三次极差 ≤ 15.625 Hz</text>
  <text x="1378" y="352" class="small">只控制同步入口</text>
  <path d="M1230 177 H1248 V228 H1270" class="line"/>
  <path d="M1230 379 H1248 V329 H1270" class="line"/>

  <text x="1725" y="62" class="title">数据位同步</text>
  <rect x="1545" y="82" width="615" height="405" rx="8" class="group"/>

  <rect x="1580" y="154" width="210" height="126" class="box"/>
  <text x="1685" y="187" class="text">20种bit边界</text>
  <text x="1685" y="220" class="small">1 / 2 / 4 s搜索</text>
  <text x="1685" y="250" class="small">频率候选固定为0 Hz</text>

  <rect x="1840" y="154" width="190" height="126" class="box"/>
  <text x="1935" y="187" class="text">独立数据确认</text>
  <text x="1935" y="220" class="small">2 s或4 s</text>
  <text x="1935" y="250" class="small">不复用搜索PDI</text>

  <rect x="2070" y="174" width="70" height="86" class="box"/>
  <text x="2105" y="207" class="text">锁定</text>
  <text x="2105" y="237" class="small">20 ms</text>

  <path d="M1485 278 H1525 V217 H1580" class="line"/>
  <path d="M1790 217 H1840" class="line"/>
  <path d="M2030 217 H2070" class="line"/>

  <rect x="1580" y="330" width="560" height="92" class="box"/>
  <text x="1860" y="365" class="text">首次候选可用于对齐20 ms积分边界</text>
  <text x="1860" y="397" class="small">只有独立确认通过，监督状态才把位同步视为锁定</text>

  <text x="500" y="535" class="title">并行码牵引</text>
  <rect x="40" y="555" width="1470" height="215" rx="8" class="group"/>
  <path d="M160 306 V646 H350" class="line"/>
  <rect x="350" y="606" width="270" height="80" class="box"/>
  <text x="485" y="637" class="text">VE/E/P/L/VL码观察</text>
  <text x="485" y="666" class="small">强入口20 ms；普通入口160 ms</text>
  <rect x="700" y="606" width="245" height="80" class="box"/>
  <text x="823" y="637" class="text">码误差鉴别</text>
  <text x="823" y="666" class="small">强入口宽峰；普通入口Prompt</text>
  <rect x="1025" y="606" width="260" height="80" class="box"/>
  <text x="1155" y="637" class="text">载波辅助DLL</text>
  <text x="1155" y="666" class="small">连续更新本地码速率</text>
  <path d="M620 646 H700" class="line"/>
  <path d="M945 646 H1025" class="line"/>
  <text x="1320" y="640" class="note">码牵引与载波牵引并行，</text>
  <text x="1320" y="670" class="note">不等待bit边界后才启动。</text>

  <text x="1570" y="754" class="note">L1 C/A位同步只搜索边界；粗频差由前级载波牵引闭环消化。</text>
</svg>
