<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430">
  <defs>
    <style>
      .title{font-family:'Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:24px;font-weight:700;fill:#0f172a}
      .h{font-family:'Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:18px;font-weight:700;fill:#0f172a}
      .t{font-family:'Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:15px;fill:#334155}
      .axis{stroke:#64748b;stroke-width:2}
      .guide{stroke:#94a3b8;stroke-width:1.5;stroke-dasharray:5 5}
      .curve{stroke:#2563eb;stroke-width:4;fill:none}
    </style>
  </defs>
  <rect width="1200" height="430" fill="#ffffff"/>
  <text x="600" y="35" text-anchor="middle" class="title">五抽头不是五个状态，而是同时观察五个本地码位置</text>
  <line x1="90" y1="325" x2="1110" y2="325" class="axis"/>
  <line x1="600" y1="80" x2="600" y2="350" class="guide"/>
  <path d="M120 320 C300 315 390 270 470 180 C525 115 565 85 600 82 C635 85 675 115 730 180 C810 270 900 315 1080 320" class="curve"/>
  <text x="600" y="390" text-anchor="middle" class="t">本地码相位（左：本地更早；右：本地更晚）</text>
  <text x="115" y="90" class="t">相关幅度</text>
  <g>
    <line x1="380" y1="240" x2="380" y2="335" class="guide"/>
    <circle cx="380" cy="240" r="9" fill="#ef4444"/>
    <text x="380" y="365" text-anchor="middle" class="h">VE</text>
    <text x="380" y="280" text-anchor="middle" class="t">更早</text>
  </g>
  <g>
    <line x1="490" y1="157" x2="490" y2="335" class="guide"/>
    <circle cx="490" cy="157" r="9" fill="#f97316"/>
    <text x="490" y="365" text-anchor="middle" class="h">E</text>
    <text x="490" y="200" text-anchor="middle" class="t">早</text>
  </g>
  <g>
    <circle cx="600" cy="82" r="11" fill="#16a34a"/>
    <text x="600" y="365" text-anchor="middle" class="h">P</text>
    <text x="600" y="125" text-anchor="middle" class="t">希望停在主峰中心</text>
  </g>
  <g>
    <line x1="710" y1="157" x2="710" y2="335" class="guide"/>
    <circle cx="710" cy="157" r="9" fill="#f97316"/>
    <text x="710" y="365" text-anchor="middle" class="h">L</text>
    <text x="710" y="200" text-anchor="middle" class="t">晚</text>
  </g>
  <g>
    <line x1="820" y1="240" x2="820" y2="335" class="guide"/>
    <circle cx="820" cy="240" r="9" fill="#ef4444"/>
    <text x="820" y="365" text-anchor="middle" class="h">VL</text>
    <text x="820" y="280" text-anchor="middle" class="t">更晚</text>
  </g>
  <text x="600" y="415" text-anchor="middle" class="t">示意曲线只解释抽头位置；BOC真实相关曲线还包含旁峰，见后文双副本图</text>
</svg>
