<path d="M470 195V242" class="line"/>
<rect x="250" y="245" width="440" height="60" rx="5" class="box"/><text x="470" y="283">逐条旋转 → 块内相干</text>
<path d="M470 305V352" class="line"/>
<rect x="250" y="355" width="440" height="60" rx="5" class="box"/><text x="470" y="393">块末取功率 → 块间累加</text>
<path d="M690 385H835V165H693" class="line"/><text x="867" y="280" class="small" transform="rotate(90 867 280)">下一个频率</text>
<path d="M470 415V462" class="line"/><text x="572" y="443" class="small">全部频率完成</text>
