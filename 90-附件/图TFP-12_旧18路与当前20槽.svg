<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520">
  <defs><style>.t{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#eef4ff}.h{font-size:24px;font-weight:700}.m{font-size:18px}.s{font-size:14px;fill:#c0ccde}.old{fill:#332b20;stroke:#e4b85e;stroke-width:2}.new{fill:#19382f;stroke:#61cb95;stroke-width:2}.a{fill:none;stroke:#ec7580;stroke-width:3}</style></defs>
  <rect width="1120" height="520" rx="22" fill="#0f1522"/><text x="560" y="42" text-anchor="middle" class="t h">旧芯片18路与当前20槽不是同一个展开维度</text>
  <rect x="55" y="92" width="430" height="260" rx="16" class="old"/><text x="270" y="130" text-anchor="middle" class="t m">旧芯片：18路码延迟相关</text><text x="270" y="174" text-anchor="middle" class="t s">同一个信号分量</text><text x="270" y="204" text-anchor="middle" class="t s">同一个本地码族</text><text x="270" y="234" text-anchor="middle" class="t s">18个不同码相位位置</text><text x="270" y="282" text-anchor="middle" class="t s">用途：密集峰搜索与局部DLL</text><text x="270" y="314" text-anchor="middle" class="t s">不表示9路数据 + 9路导频</text>
  <rect x="635" y="92" width="430" height="260" rx="16" class="new"/><text x="850" y="130" text-anchor="middle" class="t m">当前StarTrack：最多20槽</text><text x="850" y="174" text-anchor="middle" class="t s">2个分量：数据 + 导频</text><text x="850" y="204" text-anchor="middle" class="t s">2个副本：完整调制 + PRN-only</text><text x="850" y="234" text-anchor="middle" class="t s">5个抽头：VE/E/P/L/VL</text><text x="850" y="282" text-anchor="middle" class="t s">用途：现代导频、BOC与ASPeCT输入</text><text x="850" y="314" text-anchor="middle" class="t s">逻辑状态可映射到较少物理lane</text>
  <path d="M515 125L605 319M605 125L515 319" class="a"/>
  <rect x="160" y="402" width="800" height="72" rx="12" fill="#242c3a" stroke="#66758d"/><text x="560" y="431" text-anchor="middle" class="t m">本方案选择：20个逻辑状态 + 4条物理lane + 5个tap微批次</text><text x="560" y="458" text-anchor="middle" class="t s">若沿用18个物理加法单元，仍必须保留20个独立状态并设计至少两批映射。</text>
</svg>
