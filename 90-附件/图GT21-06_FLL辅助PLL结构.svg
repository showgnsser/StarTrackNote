<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510" role="img" aria-labelledby="title desc">
  <title id="title">FLL辅助PLL的共享载波环</title>
  <desc id="desc">频差和相差经各自系数作用于同一组变化率与频率积分。频率更新使用刚更新的变化率，相差另有比例支路叠加到唯一的频率输出。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#263442"/></marker></defs>
  <style>
    text { font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif; font-size:22px; fill:#263442; text-anchor:middle; }
    .small { font-size:18px; } .box { fill:#FFFFFF; stroke:#263442; stroke-width:1.5; }
    .shade { fill:#EEF3F6; stroke:#263442; stroke-width:1.5; }
    .flow { fill:none; stroke:#263442; stroke-width:1.5; marker-end:url(#arrow); }
    .line { fill:none; stroke:#263442; stroke-width:1.5; }
  </style>
  <rect width="1200" height="510" fill="#FFFFFF"/>
  <rect x="30" y="65" width="170" height="76" rx="4" class="shade"/>
  <text x="115" y="110">频差</text>
  <path d="M200 103H289" class="flow"/>
  <rect x="290" y="65" width="240" height="76" rx="4" class="box"/>
  <text x="410" y="110">FLL频差修正</text>
  <path d="M530 103H575V175H619" class="flow"/>
  <rect x="30" y="300" width="170" height="76" rx="4" class="shade"/>
  <text x="115" y="345">相差</text>
  <path d="M200 338H289" class="flow"/>
  <circle cx="245" cy="338" r="3.5" fill="#263442"/>
  <rect x="290" y="300" width="240" height="76" rx="4" class="box"/>
  <text x="410" y="345">PLL相差修正</text>
  <path d="M530 338H575V285H619" class="flow"/>
  <rect x="620" y="115" width="255" height="245" rx="4" class="box"/>
  <text x="747" y="152">共享积分状态</text>
  <path d="M642 169H853" class="line"/>
  <text x="747" y="209">变化率积分</text>
  <path d="M747 226V259" class="flow"/>
  <text x="747" y="294">频率积分</text>
  <text x="747" y="332" class="small">保留上次状态</text>
  <path d="M875 237H959" class="flow"/>
  <rect x="960" y="194" width="210" height="86" rx="4" class="shade"/>
  <text x="1065" y="229">载波频率</text>
  <text x="1065" y="259" class="small">合成控制输出</text>
  <path d="M245 338V437H1065V281" class="flow"/>
  <text x="720" y="420" class="small">相差比例修正</text>
</svg>
