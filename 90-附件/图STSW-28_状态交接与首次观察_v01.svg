<path d="M450 310V352" class="arrow"/>
<rect x="220" y="355" width="460" height="65" rx="5" class="box"/><text x="450" y="395">健康PDI确认命令编号</text>
<text x="125" y="395" class="small">历元K+1</text>
<path d="M680 388H742" class="arrow"/><rect x="745" y="335" width="270" height="140" rx="5" class="shade"/><text x="880" y="376" class="small">未确认：不提交</text><text x="880" y="408" class="small">普通候选取消</text><text x="880" y="440" class="small">安全候选重发</text>
<path d="M450 420V462" class="arrow"/>
<rect x="220" y="465" width="460" height="80" rx="5" class="box"/><text x="450" y="499">提交目标策略，重建窗口</text><text x="450" y="528" class="small">连续NCO；趋势和积分按状态边处理</text>
<path d="M450 545V587" class="arrow"/>
<rect x="220" y="590" width="460" height="65" rx="5" class="box"/><text x="450" y="630">从合法边界收满目标窗口</text>
<path d="M450 655V692" class="arrow"/>
<rect x="220" y="695" width="460" height="50" rx="5" class="shade"/><text x="450" y="729">首个新观察 → 新环路校正</text>
