<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="610" viewBox="0 0 1160 610">
  <defs><style>.t{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#eef4ff}.h{font-size:24px;font-weight:700}.m{font-size:17px}.s{font-size:14px;fill:#bfcbdd}.b{fill:#172740;stroke:#6fa8ff;stroke-width:2}.g{fill:#19382f;stroke:#61cc96;stroke-width:2}.a{fill:none;stroke:#dce7f5;stroke-width:2;marker-end:url(#x)}</style><marker id="x" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#dce7f5"/></marker></defs>
  <rect width="1160" height="610" rx="22" fill="#0f1522"/><text x="580" y="42" text-anchor="middle" class="t h">PDI是逻辑ABI；128-bit线格式必须整条原子入队</text>
  <rect x="38" y="82" width="350" height="405" rx="14" class="b"/><text x="213" y="116" text-anchor="middle" class="t m">当前PDI头部语义</text>
  <g class="t s"><text x="68" y="156">epoch、cmd_id：u64 + u64</text><text x="68" y="190">first_sample：u64</text><text x="68" y="224">sample_count：u32</text><text x="68" y="258">carrier_step/phase：u32 + u32</text><text x="68" y="292">code_step：uQ0.36</text><text x="68" y="326">code_phase：uQ14.36</text><text x="68" y="360">code_period、segment、segments</text><text x="68" y="394">partial/gap/overflow/cmd_late</text><text x="68" y="436">当前不存在mask/config代次字段</text></g>
  <rect x="430" y="82" width="340" height="405" rx="14" class="g"/><text x="600" y="116" text-anchor="middle" class="t m">相关载荷</text><text x="600" y="158" text-anchor="middle" class="t s">固定顺序：</text><text x="600" y="190" text-anchor="middle" class="t s">component → replica → tap → I/Q</text><text x="600" y="238" text-anchor="middle" class="t m">20个复数 × 48 bit</text><text x="600" y="272" text-anchor="middle" class="t s">= 960 bit</text><text x="600" y="324" text-anchor="middle" class="t s">tap线格式：P/E/L/VE/VL</text><text x="600" y="360" text-anchor="middle" class="t s">禁用槽固定为0</text><text x="600" y="396" text-anchor="middle" class="t s">不能泄漏上历元残值</text>
  <rect x="830" y="120" width="290" height="330" rx="14" class="b"/><text x="975" y="154" text-anchor="middle" class="t m">64条PDI FIFO</text><text x="975" y="194" text-anchor="middle" class="t s">候选：12 × 128 bit/条</text><text x="975" y="228" text-anchor="middle" class="t s">总计768个128-bit beat</text><text x="975" y="270" text-anchor="middle" class="t s">写前预留完整12 beat</text><text x="975" y="304" text-anchor="middle" class="t s">禁止半条记录入队</text><text x="975" y="346" text-anchor="middle" class="t s">满时停通道并报错</text><text x="975" y="380" text-anchor="middle" class="t s">绝不反压实时ADC</text><text x="975" y="414" text-anchor="middle" class="t s">绝不覆盖最老PDI</text>
  <path d="M770 281H830" class="a"/>
  <rect x="105" y="525" width="950" height="55" rx="10" fill="#29232a" stroke="#ed7883"/><text x="580" y="558" text-anchor="middle" class="t s">1536 bit/条是候选线格式，不是C++结构体padding；字段偏移、端序、版本和新增诊断必须联合冻结。</text>
</svg>
