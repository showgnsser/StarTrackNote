<svg xmlns="http://www.w3.org/2000/svg" width="1740" height="250" viewBox="0 0 1740 250">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#222222"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #222222; stroke-width: 1.6; }
      .line { fill: none; stroke: #222222; stroke-width: 1.8; marker-end: url(#arrow); }
      .text { font-family: "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; font-size: 21px; fill: #111111; text-anchor: middle; }
    </style>
  </defs>
  <rect x="0" y="0" width="1740" height="250" fill="#ffffff"/>

  <rect class="box" x="25" y="80" width="160" height="90"/>
  <text class="text" x="105" y="115"><tspan x="105">1 ms</tspan><tspan x="105" dy="29">PDI输入</tspan></text>

  <path class="line" d="M185,125 H220"/>
  <rect class="box" x="220" y="80" width="175" height="90"/>
  <text class="text" x="307.5" y="115"><tspan x="307.5">历元与命令</tspan><tspan x="307.5" dy="29">一致性检查</tspan></text>

  <path class="line" d="M395,125 H435"/>
  <rect class="box" x="435" y="80" width="175" height="90"/>
  <text class="text" x="522.5" y="115"><tspan x="522.5">NCO频率</tspan><tspan x="522.5" dy="29">中心相位换算</tspan></text>

  <path class="line" d="M610,125 H650"/>
  <rect class="box" x="650" y="80" width="175" height="90"/>
  <text class="text" x="737.5" y="115"><tspan x="737.5">相关整数</tspan><tspan x="737.5" dy="29">无损转为浮点</tspan></text>

  <path class="line" d="M825,125 H865"/>
  <rect class="box" x="865" y="80" width="175" height="90"/>
  <text class="text" x="952.5" y="115"><tspan x="952.5">选择默认</tspan><tspan x="952.5" dy="29">闭环分量</tspan></text>

  <path class="line" d="M1040,125 H1080"/>
  <rect class="box" x="1080" y="80" width="175" height="90"/>
  <text class="text" x="1167.5" y="115"><tspan x="1167.5">固定载波相位</tspan><tspan x="1167.5" dy="29">五抽头统一旋转</tspan></text>

  <path class="line" d="M1255,125 H1295"/>
  <rect class="box" x="1295" y="80" width="175" height="90"/>
  <text class="text" x="1382.5" y="115"><tspan x="1382.5">合并错误标志</tspan><tspan x="1382.5" dy="29">形成完整性</tspan></text>

  <path class="line" d="M1470,125 H1510"/>
  <rect class="box" x="1510" y="80" width="200" height="90"/>
  <text class="text" x="1610" y="115"><tspan x="1610">统一软件PDI</tspan><tspan x="1610" dy="29">送入同步与积分</tspan></text>
</svg>
