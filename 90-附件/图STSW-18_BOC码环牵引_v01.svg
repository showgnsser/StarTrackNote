<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="990" viewBox="0 0 1160 990"><title>BOC粗码牵引与细码检查</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#263442"/></marker></defs><style>text{font-family:"Noto Sans CJK SC",sans-serif;fill:#263442;text-anchor:middle;font-size:23px}.small{font-size:18px}.head{font-size:25px;font-weight:600}.node{fill:white;stroke:#263442;stroke-width:1.7}.end{fill:#eef3f6;stroke:#263442;stroke-width:1.7}.arrow{fill:none;stroke:#263442;stroke-width:1.8;marker-end:url(#a)}.dash{fill:none;stroke:#263442;stroke-width:1.8;stroke-dasharray:6 5;marker-end:url(#a)}</style><rect width="1160" height="990" fill="white"/>
<rect x="50" y="35" width="420" height="80" rx="4" class="node"/>
<text x="260" y="70" class="">五抽头粗码方向判决</text>
<text x="260" y="100" class="small">E1 8窗；B1C 1窗；两次同向</text>
<path d="M260 115V160" class="arrow"/>
<path d="M260 160L440 205L260 250L80 205Z" class="node"/>
<text x="260" y="213" class="">可靠中心？</text>
<path d="M440 205H600V75H690" class="arrow"/>
<text x="568" y="187" class="small">是</text>
<path d="M260 250V300" class="arrow"/>
<text x="290" y="279" class="small">否：外峰</text>
<rect x="50" y="300" width="420" height="80" rx="4" class="node"/>
<text x="260" y="335" class="">有限码率斜坡</text>
<text x="260" y="365" class="small">每次0.10 chip，持续160 ms</text>
<path d="M260 380V430" class="arrow"/>
<rect x="50" y="430" width="420" height="70" rx="4" class="node"/>
<text x="260" y="473" class="">停止命令由PDI确认</text>
<path d="M260 500V555" class="arrow"/>
<path d="M260 555L470 607.5L260 660L50 607.5Z" class="node"/>
<text x="260" y="615.5" class="">试探计数满足？</text>
<text x="260" y="697" class="small">E1 4次；B1C 3次</text>
<path d="M50 607H20V75H50" class="arrow"/>
<text x="89" y="547" class="small">否</text>
<path d="M470 607H600V205" class="arrow"/>
<text x="548" y="585" class="small">是</text>
<rect x="690" y="35" width="430" height="80" rx="4" class="node"/>
<text x="905" y="70" class="">细码入口命令确认</text>
<text x="905" y="100" class="small">固定E/L ±0.25；VE/VL ±0.50 chip</text>
<path d="M905 115V215" class="arrow"/>
<rect x="690" y="215" width="430" height="80" rx="4" class="node"/>
<text x="905" y="250" class="">新主码形成细码误差</text>
<text x="905" y="280" class="small">160 ms；有效且|误差|≤0.20才纠偏</text>
<path d="M905 295V365" class="arrow"/>
<rect x="690" y="365" width="430" height="80" rx="4" class="node"/>
<text x="905" y="400" class="">细DLL与外峰复核并行</text>
<text x="905" y="430" class="small">等待细码监测成熟（≥400 ms）</text>
<path d="M905 445V515" class="arrow"/>
<path d="M905 515L1095 565L905 615L715 565Z" class="node"/>
<text x="905" y="573" class="">居中条件满足？</text>
<text x="905" y="652" class="small">均值绝对值及RMS均≤0.10 chip</text>
<path d="M905 615V740" class="arrow"/>
<rect x="690" y="740" width="430" height="75" rx="7" class="end"/>
<text x="905" y="785.5" class="">开放二次码搜索</text>
<text x="947" y="704" class="small">是</text>
<path d="M1120 405H1140V905H260V735H20V75H50" class="arrow"/>
<text x="685" y="939" class="small">检查失败或可信外峰：重回粗牵引</text>
<path d="M1095 565H1140" class="arrow"/><text x="1125" y="550" class="small">否</text></svg>
