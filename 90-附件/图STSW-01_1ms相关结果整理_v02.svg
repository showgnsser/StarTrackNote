<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="250" viewBox="0 0 1420 250">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#222222"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #222222; stroke-width: 1.6; }
      .line { fill: none; stroke: #222222; stroke-width: 1.8; marker-end: url(#arrow); }
      .text { font-family: "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; font-size: 21px; fill: #111111; text-anchor: middle; }
    </style>
  </defs>
  <rect x="0" y="0" width="1420" height="250" fill="#ffffff"/>

  <rect class="box" x="25" y="80" width="170" height="90"/>
  <text class="text" x="110" y="115"><tspan x="110">1 ms</tspan><tspan x="110" dy="29">复相关</tspan></text>

  <path class="line" d="M195,125 H235"/>
  <rect class="box" x="235" y="80" width="175" height="90"/>
  <text class="text" x="322.5" y="115"><tspan x="322.5">I/Q整数</tspan><tspan x="322.5" dy="29">转为浮点</tspan></text>

  <path class="line" d="M410,125 H450"/>
  <rect class="box" x="450" y="80" width="175" height="90"/>
  <text class="text" x="537.5" y="115"><tspan x="537.5">保留全部</tspan><tspan x="537.5" dy="29">相关支路</tspan></text>

  <path class="line" d="M625,125 H665"/>
  <rect class="box" x="665" y="80" width="175" height="90"/>
  <text class="text" x="752.5" y="115"><tspan x="752.5">选择默认</tspan><tspan x="752.5" dy="29">闭环分量</tspan></text>

  <path class="line" d="M840,125 H880"/>
  <rect class="box" x="880" y="80" width="190" height="90"/>
  <text class="text" x="975" y="115"><tspan x="975">固定分量相位</tspan><tspan x="975" dy="29">对齐</tspan></text>

  <path class="line" d="M1070,125 H1110"/>
  <rect class="box" x="1110" y="80" width="280" height="90"/>
  <text class="text" x="1250" y="115"><tspan x="1250">统一复相关组</tspan><tspan x="1250" dy="29">送入同步与积分</tspan></text>
</svg>
