<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#334155"/></marker>
    <style>
      .title{font-family:'Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:24px;font-weight:700;fill:#0f172a}
      .h{font-family:'Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:17px;font-weight:700;fill:#0f172a}
      .t{font-family:'Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:14px;fill:#334155}
      .axis{stroke:#334155;stroke-width:2}
      .dash{stroke:#64748b;stroke-width:1.5;stroke-dasharray:5 5}
      .arrow{stroke:#334155;stroke-width:2;fill:none;marker-end:url(#a)}
    </style>
  </defs>
  <rect width="1200" height="520" fill="#fff"/>
  <text x="600" y="36" text-anchor="middle" class="title">slew负责“有限移动”，FineCheck负责“确认移动后真的进了中央主峰”</text>
  <text x="70" y="105" class="h">额外码率</text>
  <line x1="150" y1="145" x2="1110" y2="145" class="axis"/>
  <path d="M215 145 L215 80 L535 80 L535 145" stroke="#2563eb" stroke-width="5" fill="none"/>
  <line x1="215" y1="65" x2="215" y2="365" class="dash"/>
  <line x1="535" y1="65" x2="535" y2="365" class="dash"/>
  <text x="375" y="67" text-anchor="middle" class="h">固定160 ms临时偏置</text>
  <text x="375" y="120" text-anchor="middle" class="t">0.625 chip/s × 0.160 s = 0.1 chip</text>
  <text x="70" y="235" class="h">累计码相位</text>
  <line x1="150" y1="330" x2="1110" y2="330" class="axis"/>
  <path d="M150 330 L215 330 L535 235 L1110 235" stroke="#16a34a" stroke-width="5" fill="none"/>
  <text x="550" y="222" class="t">总共移动0.1 chip后保持，不继续漂移</text>
  <rect x="565" y="75" width="145" height="100" rx="12" fill="#fef3c7" stroke="#334155" stroke-width="2"/>
  <text x="638" y="110" text-anchor="middle" class="h">停止命令</text>
  <text x="638" y="137" text-anchor="middle" class="t">软件已生成</text>
  <text x="638" y="160" text-anchor="middle" class="t">等待PDI确认ID</text>
  <path d="M535 95 H565" class="arrow"/>
  <rect x="760" y="70" width="300" height="120" rx="12" fill="#ede9fe" stroke="#334155" stroke-width="2"/>
  <text x="910" y="103" text-anchor="middle" class="h">FineCheck（细码复核）</text>
  <text x="910" y="132" text-anchor="middle" class="t">重新从完整主码边界积累细码观察</text>
  <text x="910" y="157" text-anchor="middle" class="t">先监测均值和RMS，暂不让DLL PI接管</text>
  <text x="910" y="180" text-anchor="middle" class="t">确认中央主峰后才开放PilotSync</text>
  <path d="M710 125 H760" class="arrow"/>
  <rect x="180" y="405" width="840" height="75" rx="12" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="600" y="435" text-anchor="middle" class="h">关键区别</text>
  <text x="600" y="462" text-anchor="middle" class="t">slew是控制动作；FineCheck是只读安全门。二者都不是新的FSM状态。</text>
</svg>
