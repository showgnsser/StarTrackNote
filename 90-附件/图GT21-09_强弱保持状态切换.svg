<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="270" viewBox="0 0 1200 270" role="img" aria-labelledby="title desc">
  <title id="title">强弱保持的功率重叠区</title>
  <desc id="desc">ShortSlow低于28 dB-Hz并确认后降LongSlow，LongSlow达到30 dB-Hz并确认后恢复。LongSlow低于等于13.5 dB-Hz且频差允许接管时进入Sensitivity，Sensitivity高于16 dB-Hz并确认后恢复LongSlow。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#263442"/></marker></defs>
  <style>
    text { font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif; font-size:22px; fill:#263442; text-anchor:middle; }
    .small { font-size:18px; } .box { fill:#FFFFFF; stroke:#263442; stroke-width:1.5; }
    .flow { fill:none; stroke:#263442; stroke-width:1.5; marker-end:url(#arrow); }
  </style>
  <rect width="1200" height="270" fill="#FFFFFF"/>
  <rect x="30" y="85" width="240" height="100" rx="4" class="box"/>
  <text x="150" y="124">强信号保持</text><text x="150" y="158" class="small">ShortSlow</text>
  <rect x="480" y="85" width="240" height="100" rx="4" class="box"/>
  <text x="600" y="124">弱信号保持</text><text x="600" y="158" class="small">LongSlow</text>
  <rect x="930" y="85" width="240" height="100" rx="4" class="box"/>
  <text x="1050" y="124">极弱低动态保持</text><text x="1050" y="158" class="small">Sensitivity</text>
  <path d="M270 112H479" class="flow"/>
  <text x="375" y="95" class="small">C＜28，确认</text>
  <path d="M480 157H271" class="flow"/>
  <text x="375" y="184" class="small">C≥30，确认</text>
  <path d="M720 112H929" class="flow"/>
  <text x="825" y="69" class="small">C≤13.5</text>
  <text x="825" y="95" class="small">频差满足，确认</text>
  <path d="M930 157H721" class="flow"/>
  <text x="825" y="184" class="small">C＞16，确认</text>
  <text x="600" y="239" class="small">C为跟踪分量载噪比，单位dB-Hz</text>
</svg>
