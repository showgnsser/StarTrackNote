<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560">
  <defs><style>.t{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#eef4ff}.h{font-size:25px;font-weight:700}.m{font-size:18px}.s{font-size:15px}.hw{fill:#17243c;stroke:#68a4ff;stroke-width:2}.sw{fill:#17342b;stroke:#5dcc91;stroke-width:2}.no{fill:#392126;stroke:#ef6d7a;stroke-width:2}</style></defs>
  <rect width="1100" height="560" rx="22" fill="#0e1522"/>
  <text x="550" y="42" text-anchor="middle" class="t h">硬件只做逐样点确定性运算，软件负责跨PDI算法</text>
  <rect x="45" y="78" width="490" height="355" rx="16" class="hw"/>
  <text x="290" y="116" text-anchor="middle" class="t h">硬件定点域</text>
  <text x="78" y="158" class="t m">✓ IQ解包与绝对样点计数</text><text x="78" y="197" class="t m">✓ 载波NCO、16相位DDC</text><text x="78" y="236" class="t m">✓ 码NCO、主码RAM与BOC符号</text><text x="78" y="275" class="t m">✓ P/E/L/VE/VL分批相关</text><text x="78" y="314" class="t m">✓ 1 ms边界、s24累加、PDI队列</text><text x="78" y="353" class="t m">✓ 命令边界锁存和异常诊断</text>
  <rect x="565" y="78" width="490" height="355" rx="16" class="sw"/>
  <text x="810" y="116" text-anchor="middle" class="t h">软件浮点/整数算法域</text>
  <text x="598" y="158" class="t m">✓ PDI解码与长相干/非相干积累</text><text x="598" y="197" class="t m">✓ FMS、DFT、Cross/Dot、PLL</text><text x="598" y="236" class="t m">✓ DLL、ASPeCT式(13)/(14)</text><text x="598" y="275" class="t m">✓ 导航bit/公开二次码同步与擦除</text><text x="598" y="314" class="t m">✓ C/N0、锁定监测和状态机</text><text x="598" y="353" class="t m">✓ 下一历元命令生成</text>
  <rect x="185" y="460" width="730" height="64" rx="12" class="no"/><text x="550" y="489" text-anchor="middle" class="t m">禁止边界漂移</text><text x="550" y="514" text-anchor="middle" class="t s">硬件不偷偷做长积分或ASPeCT；软件不读取原始IQ重新相关</text>
</svg>
