<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="700" viewBox="0 0 1440 700">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#222222"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #222222; stroke-width: 1.6; }
      .region { fill: none; stroke: #666666; stroke-width: 1.3; stroke-dasharray: 7 6; }
      .line { fill: none; stroke: #222222; stroke-width: 1.7; marker-end: url(#arrow); }
      .feedback { fill: none; stroke: #555555; stroke-width: 1.6;
                  stroke-dasharray: 7 5; marker-end: url(#arrow); }
      .title { font-size: 20px; fill: #111111; text-anchor: middle; }
      .text { font-size: 16px; fill: #222222; text-anchor: middle; }
      .label { font-size: 16px; fill: #222222; }
      .small { font-size: 15px; fill: #333333; text-anchor: middle; }
    </style>
  </defs>
  <rect x="0" y="0" width="1440" height="700" fill="#ffffff"/>

  <rect class="region" x="18" y="25" width="1082" height="555"/>
  <text class="label" x="35" y="55" font-family="SimSun, Songti SC, serif">硬件相关通道</text>

  <rect class="box" x="42" y="142" width="138" height="78"/>
  <text class="title" x="111" y="174" font-family="SimSun, Songti SC, serif">ADC输入</text>
  <text class="text" x="111" y="203" font-family="'Times New Roman', serif">s4 I / Q</text>

  <path class="line" d="M180,181 H230"/>
  <rect class="box" x="232" y="126" width="172" height="110"/>
  <text class="title" x="318" y="164" font-family="SimSun, Songti SC, serif">载波DDC</text>
  <text class="text" x="318" y="193" font-family="SimSun, Songti SC, serif">复数共轭混频</text>
  <text class="text" x="318" y="221" font-family="'Times New Roman', serif">s4 → s5 I / Q</text>

  <path class="line" d="M404,181 H624"/>
  <text class="small" x="514" y="168" font-family="'Times New Roman', serif">s5 I / Q shared bus</text>

  <rect class="box" x="626" y="72" width="252" height="218"/>
  <text class="title" x="752" y="108" font-family="SimSun, Songti SC, serif">十一条复相关支路</text>
  <text class="text" x="752" y="144" font-family="SimSun, Songti SC, serif">导频调制五抽头</text>
  <text class="text" x="752" y="173" font-family="'Times New Roman', serif">VE / E / P / L / VL</text>
  <text class="text" x="752" y="207" font-family="SimSun, Songti SC, serif">导频PRN-only五抽头</text>
  <text class="text" x="752" y="236" font-family="'Times New Roman', serif">VE / E / P / L / VL</text>
  <text class="text" x="752" y="271" font-family="SimSun, Songti SC, serif">数据调制P</text>

  <path class="line" d="M878,181 H910"/>
  <rect class="box" x="912" y="72" width="168" height="218"/>
  <text class="title" x="996" y="108" font-family="SimSun, Songti SC, serif">1 ms复数积分</text>
  <text class="text" x="996" y="145" font-family="SimSun, Songti SC, serif">十一组独立累加器</text>
  <text class="text" x="996" y="180" font-family="'Times New Roman', serif">11 × s18 I / Q</text>
  <text class="text" x="996" y="215" font-family="SimSun, Songti SC, serif">两组导频五抽头</text>
  <text class="text" x="996" y="244" font-family="SimSun, Songti SC, serif">一组数据P</text>
  <text class="text" x="996" y="275" font-family="SimSun, Songti SC, serif">PDI输出</text>

  <rect class="box" x="232" y="432" width="172" height="86"/>
  <text class="title" x="318" y="467" font-family="SimSun, Songti SC, serif">载波NCO</text>
  <text class="text" x="318" y="498" font-family="'Times New Roman', serif">u32 phase / step</text>
  <path class="line" d="M318,432 V236"/>

  <rect class="box" x="410" y="432" width="140" height="86"/>
  <text class="title" x="480" y="467" font-family="SimSun, Songti SC, serif">码NCO</text>
  <text class="text" x="480" y="498" font-family="'Times New Roman', serif">uQ14.36 phase</text>

  <path class="line" d="M550,475 H578"/>
  <rect class="box" x="580" y="420" width="154" height="110"/>
  <text class="title" x="657" y="457" font-family="SimSun, Songti SC, serif">五抽头生成</text>
  <text class="text" x="657" y="489" font-family="'Times New Roman', serif">VE / E / P / L / VL</text>
  <text class="text" x="657" y="516" font-family="'Times New Roman', serif">uQ14.36</text>

  <path class="line" d="M734,475 H760"/>
  <rect class="box" x="762" y="412" width="146" height="126"/>
  <text class="title" x="835" y="447" font-family="SimSun, Songti SC, serif">数据/导频PRN</text>
  <text class="title" x="835" y="474" font-family="'Times New Roman', serif">RAM</text>
  <text class="text" x="835" y="505" font-family="SimSun, Songti SC, serif">按抽头地址读码</text>
  <text class="text" x="835" y="528" font-family="'Times New Roman', serif">+1 / -1</text>

  <path class="line" d="M908,475 H926"/>
  <rect class="box" x="928" y="390" width="152" height="170"/>
  <text class="title" x="1004" y="425" font-family="SimSun, Songti SC, serif">BOC与副本选择</text>
  <text class="text" x="1004" y="458" font-family="SimSun, Songti SC, serif">导频调制五抽头</text>
  <text class="text" x="1004" y="487" font-family="SimSun, Songti SC, serif">导频PRN-only</text>
  <text class="text" x="1004" y="511" font-family="SimSun, Songti SC, serif">五抽头</text>
  <text class="text" x="1004" y="536" font-family="SimSun, Songti SC, serif">数据调制P</text>

  <path class="line" d="M657,420 V355 H1004 V390"/>
  <text class="small" x="830" y="345" font-family="'Times New Roman', serif">F_t[35] : BOC sign</text>
  <path class="line" d="M1004,390 V328 H752 V290"/>

  <path class="line" d="M1080,181 H1168"/>
  <text class="small" x="1124" y="168" font-family="SimSun, Songti SC, serif">11组PDI</text>
  <rect class="box" x="1170" y="110" width="238" height="148"/>
  <text class="title" x="1289" y="147" font-family="SimSun, Songti SC, serif">后级跟踪控制</text>
  <text class="text" x="1289" y="184" font-family="SimSun, Songti SC, serif">读取PDI结果</text>
  <text class="text" x="1289" y="217" font-family="SimSun, Songti SC, serif">更新NCO与抽头参数</text>

  <path class="feedback" d="M1238,258 V610 H318 V518"/>
  <text class="label" x="713" y="599" font-family="'Times New Roman', serif">carrier_step</text>
  <path class="feedback" d="M1340,258 V650 H480 V518"/>
  <text class="label" x="760" y="640" font-family="'Times New Roman', serif">code_step / tap spacing</text>
</svg>
