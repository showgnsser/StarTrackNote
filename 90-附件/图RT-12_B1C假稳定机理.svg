<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="580" viewBox="0 0 1300 580">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#334155"/></marker>
    <style>
      .title{font-family:'Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:24px;font-weight:700;fill:#0f172a}
      .h{font-family:'Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:17px;font-weight:700;fill:#0f172a}
      .t{font-family:'Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:14px;fill:#334155}
      .box{stroke:#334155;stroke-width:2;rx:12;ry:12}
      .arrow{stroke:#334155;stroke-width:2;fill:none;marker-end:url(#a)}
      .bad{stroke:#dc2626;stroke-width:3;fill:none;marker-end:url(#a)}
    </style>
  </defs>
  <rect width="1300" height="580" fill="#fff"/>
  <text x="650" y="38" text-anchor="middle" class="title">同步标志假稳定：历史边界仍在，但当前物理峰已经错了</text>
  <rect x="55" y="105" width="210" height="110" class="box" fill="#dcfce7"/>
  <text x="160" y="140" text-anchor="middle" class="h">过去：正确锁定</text>
  <text x="160" y="170" text-anchor="middle" class="t">PilotSync完成搜索与确认</text>
  <text x="160" y="195" text-anchor="middle" class="t">sync = 1</text>
  <rect x="325" y="105" width="220" height="110" class="box" fill="#fef3c7"/>
  <text x="435" y="140" text-anchor="middle" class="h">弱信号 + 复合动态</text>
  <text x="435" y="170" text-anchor="middle" class="t">rate + sine + jerk + TCXO</text>
  <text x="435" y="195" text-anchor="middle" class="t">真实峰逐渐离开局部域</text>
  <rect x="605" y="80" width="250" height="160" class="box" fill="#fee2e2"/>
  <text x="730" y="115" text-anchor="middle" class="h">局部观察器仍给小量</text>
  <text x="730" y="147" text-anchor="middle" class="t">Sensitivity局部FMS围绕错误零点</text>
  <text x="730" y="175" text-anchor="middle" class="t">局部DLL也可能落到BOC旁峰</text>
  <text x="730" y="203" text-anchor="middle" class="t">ready/valid/used仍可能为true</text>
  <rect x="915" y="105" width="300" height="110" class="box" fill="#f1f5f9"/>
  <text x="1065" y="140" text-anchor="middle" class="h">表面日志“很稳定”</text>
  <text x="1065" y="170" text-anchor="middle" class="t">sync=1，PDI/cmd=0，freq_used=1</text>
  <text x="1065" y="195" text-anchor="middle" class="t">但这些不是正确峰的独立证明</text>
  <path d="M265 160 H325" class="arrow"/><path d="M545 160 H605" class="arrow"/><path d="M855 160 H915" class="arrow"/>
  <rect x="325" y="340" width="550" height="130" class="box" fill="#fee2e2"/>
  <text x="600" y="377" text-anchor="middle" class="h">实际物理结果持续恶化</text>
  <text x="600" y="410" text-anchor="middle" class="t">transition_08：Doppler RMS/P95 = 17.308/22.226 Hz</text>
  <text x="600" y="438" text-anchor="middle" class="t">码P95 = 1.552 chip，已经不在正确主峰</text>
  <path d="M1065 215 C1065 300 875 325 875 390" class="bad"/>
  <rect x="940" y="350" width="275" height="105" class="box" fill="#e0f2fe"/>
  <text x="1078" y="382" text-anchor="middle" class="h">正确整改方向</text>
  <text x="1078" y="410" text-anchor="middle" class="t">恢复到正确峰，或明确撤销同步</text>
  <text x="1078" y="435" text-anchor="middle" class="t">禁止继续把sync=1当成稳定</text>
  <path d="M875 405 H940" class="arrow"/>
  <text x="650" y="535" text-anchor="middle" class="h">完整性原则：无法证明仍在正确峰时，诚实地失锁比错误地稳定更安全</text>
</svg>
