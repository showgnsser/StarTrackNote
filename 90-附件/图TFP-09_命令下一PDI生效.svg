<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="550" viewBox="0 0 1160 550">
  <defs><style>.t{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#eef4ff}.h{font-size:24px;font-weight:700}.m{font-size:16px}.s{font-size:13px;fill:#becadd}.hw{fill:#172b47;stroke:#6fa9ff;stroke-width:2}.sw{fill:#19382f;stroke:#60ca94;stroke-width:2}.warn{fill:#3a282a;stroke:#ef7880;stroke-width:2}.a{fill:none;stroke:#dce7f5;stroke-width:2;marker-end:url(#x)}</style><marker id="x" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#dce7f5"/></marker></defs>
  <rect width="1160" height="550" rx="22" fill="#0f1522"/><text x="580" y="42" text-anchor="middle" class="t h">连续ADC中的真实命令时序：PDI n计算结果最早作用于PDI n+2</text>
  <rect x="45" y="95" width="220" height="94" rx="12" class="hw"/><text x="155" y="127" text-anchor="middle" class="t m">边界：PDI n完成</text><text x="155" y="157" text-anchor="middle" class="t s">n+1首样点立即开始</text>
  <rect x="315" y="95" width="250" height="94" rx="12" class="hw"/><text x="440" y="127" text-anchor="middle" class="t m">硬件连续处理PDI n+1</text><text x="440" y="157" text-anchor="middle" class="t s">仍使用旧applied命令</text>
  <rect x="315" y="255" width="250" height="108" rx="12" class="sw"/><text x="440" y="288" text-anchor="middle" class="t m">软件消费PDI n</text><text x="440" y="317" text-anchor="middle" class="t s">观察器→环路→FSM</text><text x="440" y="345" text-anchor="middle" class="t s">在n+1期间写pending</text>
  <rect x="615" y="95" width="210" height="94" rx="12" class="sw"/><text x="720" y="127" text-anchor="middle" class="t m">pending已到达</text><text x="720" y="157" text-anchor="middle" class="t s">apply_epoch=n+2</text>
  <rect x="875" y="95" width="235" height="94" rx="12" class="hw"/><text x="993" y="127" text-anchor="middle" class="t m">n+2边界原子锁存</text><text x="993" y="157" text-anchor="middle" class="t s">全部字段一起变applied</text>
  <path d="M265 142H315M565 142H615M825 142H875" class="a"/><path d="M265 165C280 240 290 289 315 300" class="a"/><path d="M565 300C610 300 615 188 670 188" class="a"/>
  <rect x="170" y="414" width="820" height="78" rx="12" class="warn"/><text x="580" y="444" text-anchor="middle" class="t m">相位连续性：n+2首样点相位由旧step推进得到</text><text x="580" y="474" text-anchor="middle" class="t s">新step从这个首样点之后参与递推；PDI n+2回报新cmd_id，软件据此确认状态切换。</text>
  <text x="580" y="526" text-anchor="middle" class="t s">捕获首命令在start_sample到来前预装；当前C++的n+1行为是暂停输入的无耗时模型，不是实时RTL能力。</text>
</svg>
