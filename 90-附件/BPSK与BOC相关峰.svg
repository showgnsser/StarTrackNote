  <path d="M150 460 C205 455,225 365,280 350 C335 335,350 455,400 440 C450 425,455 210,520 145 C585 210,590 425,640 440 C690 455,705 335,760 350 C815 365,835 455,890 460" fill="none" stroke="#eb5757" stroke-width="5"/>
